    <details class="box"><summary>Dernière question</summary><p>${esc(g.question)}</p>${reveal}</details>
    ${scoreBlock(v)}
    ${v.isHost ? `<button class="btn" data-act="o-send" data-a="again">Rejouer</button><button class="btn-ghost" data-act="o-send" data-a="lobby">Retour au lobby</button>` : `<p class="hint">En attente de l'hôte.</p>`}`;
}

function vODr(v) {
  const g = v.game;
  const force = v.isHost ? `<button class="btn-ghost lg-force" data-act="o-send" data-a="dr-force">Passer (joueur absent)</button>` : "";
  const wordBox = !g.inGame ? "" : g.isImp
    ? `<div class="dr-word imp"><span class="eyebrow">Catégorie : ${esc(g.cat)}</span><b>Tu es l'imposteur</b><small>Tu ne connais pas le mot. Dessine comme si tu savais, et devine-le en regardant les autres.</small></div>`
    : `<div class="dr-word"><span class="eyebrow">Catégorie : ${esc(g.cat)}</span><b>${O.revealMine ? esc(g.word) : "██████"}</b><button class="btn-small" data-act="o-reveal">${O.revealMine ? "Cacher le mot" : "Voir le mot"}</button></div>`;
  const players = `<div class="dr-order">${g.order.map(p => `<span class="dr-p ${p.cur ? "cur" : ""}" style="--pc:${p.color}">${esc(p.name)}${p.me ? " (toi)" : ""}</span>`).join("")}</div>`;
  if (g.phase === "draw") {
    const pending = !!O.drPending;
    return `<header class="section"><span class="eyebrow">Imposteur dessin · tour ${g.lap}/${g.laps}</span>
        <h2>${g.myTurn ? (pending ? "Ton trait est prêt" : "À toi : un seul trait") : `${esc(g.current)} dessine…`}</h2>
        <p class="lead">${g.myTurn ? "Dessine un trait sans lever le doigt. Pas trop précis si tu connais le mot, sinon l'imposteur le trouve !" : "Chacun ajoute un trait au dessin, à tour de rôle."}</p></header>
      ${wordBox}
      <div class="dr-wrap ${g.myTurn && !pending ? "active" : ""}" style="--pc:${g.myColor}"><canvas id="dr-canvas" class="dr-canvas" aria-label="Dessin commun"></canvas></div>
      ${g.myTurn && pending ? `<div class="row"><button class="btn-ghost" data-act="o-drundo">Recommencer mon trait</button><button class="btn" data-act="o-drsend">Valider mon trait</button></div>` : ""}
      ${players}${force}`;
  }
  if (g.phase === "vote") {
    let mine;
    if (!g.inGame) mine = "";
    else if (g.myVote) mine = `<div class="banner">Tu as voté contre ${esc(g.myVote)}.</div>`;
    else mine = `<div class="vote">${g.order.filter(p => !p.me).map(p => `<button data-act="o-sel" data-x="${p.pid}" aria-pressed="${O.sel === p.pid}"><span>${esc(p.name)}</span><i class="dr-dot" style="--pc:${p.color}"></i></button>`).join("")}</div>
      ${O.sel ? `<button class="btn btn-danger" data-act="o-send" data-a="dr-vote" data-x="${O.sel}">Voter contre ${esc(g.order.find(p => p.pid === O.sel).name)}</button>` : ""}`;
    return `<header class="section"><span class="eyebrow">Imposteur dessin · vote</span><h2>Qui est l'imposteur ?</h2>
      <p class="lead">Regardez qui a fait des traits bizarres. Votes : ${g.count}/${g.total}.</p></header>
      <div class="dr-wrap"><canvas id="dr-canvas" class="dr-canvas" aria-label="Dessin commun"></canvas></div>${players}${wordBox}${mine}
      ${v.isHost && g.count < g.total ? `<button class="btn-ghost" data-act="o-send" data-a="dr-force">Dépouiller sans attendre</button>` : ""}`;
  }
  if (g.phase === "guess") {
    return `<header class="section"><span class="eyebrow">Imposteur dessin · dernière chance</span><h2>${esc(g.accused)} est démasqué !</h2>
      <p class="lead">${g.isImp ? "Tu peux encore gagner : quel est le mot ?" : "L'imposteur a une dernière chance : s'il devine le mot, il gagne quand même."}</p></header>
      <div class="dr-wrap"><canvas id="dr-canvas" class="dr-canvas" aria-label="Dessin commun"></canvas></div>
      ${g.val ? valBlock(g.val, `L'imposteur propose « ${esc(g.val.data.guess)} »`, g.val.canVote ? `Le mot était <b>${esc(g.val.data.word)}</b>. Sa réponse compte-t-elle ?` : "")
        : g.isImp ? `<input type="text" id="o-drguess" data-o="drGuess" maxlength="60" placeholder="Le mot…" autocomplete="off" value="${esc(O.drGuess || "")}"><button class="btn" data-act="o-send" data-a="dr-guess" data-from="drGuess">Valider</button>` : ""}
      ${force}`;
  }
  const impWin = g.winner === "imp";
  return `<header class="section"><span class="eyebrow">Imposteur dessin · fin</span><h1 style="font-size:2.8rem">${impWin ? "L'imposteur gagne" : "Imposteur démasqué"}</h1></header>
    <div class="card"><span class="eyebrow">Le mot était</span><div class="word">${esc(g.word)}</div><span class="eyebrow">Imposteur : ${esc(g.imp)}</span>
      ${g.guess ? `<p>Sa réponse : « ${esc(g.guess)} »</p>` : g.accused ? "" : `<p>Le village s'est trompé de cible${g.accused === null ? " (égalité)" : ""}.</p>`}</div>
    <div class="dr-wrap"><canvas id="dr-canvas" class="dr-canvas" aria-label="Dessin final"></canvas></div>${players}
    ${scoreBlock(v)}
    ${v.isHost ? `<button class="btn" data-act="o-send" data-a="again">Rejouer</button><button class="btn-ghost" data-act="o-send" data-a="lobby">Retour au lobby</button>` : `<p class="hint">En attente de l'hôte.</p>`}`;
}

function qdLobbySettings(v) {
  const st = v.settings.qd;
  return `<section class="section"><span class="label">Questions</span><div class="chips">${QD_PACKS.map(p => `<button class="chip" data-act="o-send" data-a="qd-set" data-x="pack:${p.id}" aria-pressed="${st.packs.includes(p.id)}">${esc(p.name)}<small>${p.q.length}</small></button>`).join("")}</div></section>
    <section class="section"><span class="label">Nombre de questions</span><div class="chips">${[5, 8, 10].map(n => `<button class="chip" data-act="o-send" data-a="qd-set" data-x="rounds:${n}" aria-pressed="${st.rounds === n}">${n}</button>`).join("")}</div></section>
    <p class="hint">Minimum 3 joueurs. Chacun répond en secret, puis devine qui a écrit quoi.</p>`;
}
function drLobbySettings(v) {
  const st = v.settings.dr;
  return `<section class="section"><span class="label">Mots à dessiner</span><div class="chips">${DR_CATS().map(c => `<button class="chip" data-act="o-send" data-a="dr-set" data-x="cat:${c.id}" aria-pressed="${st.cats.includes(c.id)}">${esc(c.name)}<small>${c.words.length}</small></button>`).join("")}</div></section>
    <section class="section"><span class="label">Traits par joueur</span><div class="chips">${[2, 3].map(n => `<button class="chip" data-act="o-send" data-a="dr-set" data-x="laps:${n}" aria-pressed="${st.laps === n}">${n}</button>`).join("")}</div></section>
    <p class="hint">Minimum 3 joueurs. Un imposteur ne connaît pas le mot et doit dessiner sans se faire repérer.</p>`;
}
function qdSet(x) {
  const st = L.settings.qd, [k, val] = String(x || "").split(":");
  if (k === "pack" && QD_PACKS.some(p => p.id === val)) { st.packs = st.packs.includes(val) ? st.packs.filter(p => p !== val) : st.packs.concat(val); if (!st.packs.length) st.packs = [val]; }
  if (k === "rounds") st.rounds = [5, 8, 10].includes(+val) ? +val : 5;
}
function drSet(x) {
  const st = L.settings.dr, [k, val] = String(x || "").split(":");
  if (k === "cat" && DR_CATS().some(c => c.id === val)) { st.cats = st.cats.includes(val) ? st.cats.filter(c => c !== val) : st.cats.concat(val); if (!st.cats.length) st.cats = [val]; }
  if (k === "laps") st.laps = +val === 3 ? 3 : 2;
}

/* ---------- Écrans en ligne ---------- */
function vOnline() {
  if (O.screen === "entry") return vOEntry();
  const v = O.view;
  if (!v) return `<p class="lead">Connexion…</p>`;
  const ban = O.offline ? `<div class="banner warn" role="status">Connexion perdue. Reconnexion en cours…</div>`
    : (!O.isHost && O.hostAway) ? `<div class="banner warn" role="status">L'hôte a perdu la connexion. La partie reprend dès qu'il revient.</div>` : "";
  if (!v.game) return ban + vOLobby(v);
  return ban + ({ uc: vOUc, lg: vOLg, qs: vOQs, qd: vOQd, dr: vODr, tp: vOTp })[v.game.kind](v);
}
function vOEntry() {
  return `${backHome}
  <header class="section">
    <span class="eyebrow">En ligne · un téléphone par joueur</span>
    <h1>${O.pendingGame ? esc(GAME_NAMES[O.pendingGame]) : "Lobby"}</h1>
    <p class="lead">Crée le lobby et partage le code à tes potes, ou rejoins celui d'un pote. Tu pourras changer de jeu dans le lobby.</p>
  </header>
  ${ONLINE_OK ? "" : `<div class="banner warn">Le mode en ligne ne marche pas dans cet aperçu. Pour jouer en ligne, ouvre le site : <a href="https://mirwaisxx.github.io/jeux/" target="_blank" rel="noopener" style="color:inherit">mirwaisxx.github.io/jeux</a></div>`}
  <section class="section">
    <label class="label" for="o-name">Ton pseudo</label>
    <input type="text" id="o-name" data-o="name" maxlength="16" value="${esc(ostore.name)}" placeholder="Ex. Mirwais" autocomplete="off">
  </section>
  ${O.resumeCode && ONLINE_OK ? `<button class="btn" data-act="o-resume" ${O.busy ? "disabled" : ""}>Reprendre mon lobby ${esc(O.resumeCode)}</button>` : ""}
  <button class="${O.resumeCode && ONLINE_OK ? "btn-ghost" : "btn"}" data-act="o-create" ${O.busy ? "disabled" : ""}>Créer un ${O.resumeCode && ONLINE_OK ? "nouveau " : ""}lobby${O.pendingGame ? " " + esc(GAME_NAMES[O.pendingGame]) : ""}</button>
  <section class="confirm">
    <label class="label" for="o-code">Rejoindre avec un code</label>
    <input type="text" id="o-code" class="code-input" data-o="code" maxlength="4" value="${esc(O.code)}" placeholder="KXPM" autocomplete="off" autocapitalize="characters">
    <button class="btn-ghost" data-act="o-join" ${O.busy ? "disabled" : ""}>Rejoindre</button>
  </section>
  <p class="msg">${esc(O.msg)}</p>
  <p class="hint">Marche en wifi comme en 4G. Le téléphone qui crée le lobby mène la partie : s'il recharge la page, il peut reprendre son lobby.</p>`;
}
function scoreBlock(v) {
  const sc = Object.entries(v.scores || {}).sort((a, b) => b[1] - a[1]);
  if (!sc.length) return "";
  return `<section class="section"><span class="label">Points du lobby</span><div class="scores">${sc.map(([n, s]) => `<div class="score-row"><span>${esc(n)}</span><b>${s} pt${s > 1 ? "s" : ""}</b></div>`).join("")}</div></section>`;
}
function leaveBlock(v) {
  if (O.confirmLeave) return `<div class="confirm"><p>Si tu quittes, le lobby se ferme pour tout le monde.</p><div class="row"><button class="btn btn-danger" data-act="o-leaveNow">Fermer le lobby</button><button class="btn-ghost" data-act="o-cancelLeave">Rester</button></div></div>`;
  return `<button class="btn-ghost" data-act="o-leave">${v.isHost ? "Fermer le lobby" : "Quitter le lobby"}</button>`;
}
function vOLobby(v) {
  const s = v.settings;
  const gameName = GAME_NAMES[s.game];
  const plist = v.players.map(p => `<div class="score-row"><span>${p.online ? "" : "(hors ligne) "}${esc(p.name)}${p.host ? " · hôte" : ""}${p.pid === v.me ? " · toi" : ""}</span>${v.isHost && !p.host ? `<button class="btn-small" data-act="o-send" data-a="kick" data-x="${p.pid}">Retirer</button>` : "<b></b>"}</div>`).join("");
  let settings;
  if (v.isHost) {
    const gameChips = `<div class="chips"><button class="chip" data-act="o-send" data-a="set-game" data-x="uc" aria-pressed="${s.game === "uc"}">Undercover</button><button class="chip" data-act="o-send" data-a="set-game" data-x="qs" aria-pressed="${s.game === "qs"}">Devine Tête</button><button class="chip" data-act="o-send" data-a="set-game" data-x="lg" aria-pressed="${s.game === "lg"}">Loup-Garou</button><button class="chip" data-act="o-send" data-a="set-game" data-x="qd" aria-pressed="${s.game === "qd"}">Qui a dit ça ?</button><button class="chip" data-act="o-send" data-a="set-game" data-x="dr" aria-pressed="${s.game === "dr"}">Imposteur dessin</button><button class="chip" data-act="o-send" data-a="set-game" data-x="tp" aria-pressed="${s.game === "tp"}">Tu préfères</button></div>`;
    const opts = s.game === "lg" ? lgLobbySettings(v) : s.game === "qd" ? qdLobbySettings(v) : s.game === "dr" ? drLobbySettings(v) : s.game === "tp" ? tpLobbySettings(v) : s.game === "uc"
      ? `<div class="chips"><button class="chip" data-act="o-send" data-a="theme" data-x="all" aria-pressed="${s.themes.includes("all")}">Tous les thèmes</button>${allThemes().map(t => `<button class="chip" data-act="o-send" data-a="theme" data-x="${esc(t.id)}" aria-pressed="${s.themes.includes(t.id)}">${esc(t.name)}<small>${ucPairs(t).length}</small></button>`).join("")}</div>
         <div class="toggle"><div class="t-text"><div class="label">Mr. White</div><div class="t-sub">Un joueur sans mot, à partir de 4 joueurs.</div></div><button class="switch" role="switch" aria-label="Activer Mr. White" aria-checked="${s.white}" data-act="o-send" data-a="white"></button></div>`
      : `<div class="chips"><button class="chip" data-act="o-send" data-a="cat" data-x="all" aria-pressed="${s.cats.includes("all")}">Tout</button>${DT_CATS.map(c => `<button class="chip" data-act="o-send" data-a="cat" data-x="${c.id}" aria-pressed="${s.cats.includes(c.id)}">${esc(c.name)}<small>${dtItems(c).length}</small></button>`).join("")}</div>`;
    settings = `<section class="section"><span class="label">Jeu</span>${gameChips}</section>
      ${["lg", "qd", "dr", "tp"].includes(s.game) ? opts : `<section class="section"><span class="label">${s.game === "uc" ? "Thèmes" : "Persos proposés"}</span>${opts}</section>`}
      <p class="msg">${esc(v.note)}</p>
      <button class="btn" data-act="o-send" data-a="start">Lancer ${gameName}</button>`;
  } else {
    settings = `<section class="confirm"><span class="label">${gameName}</span><p class="hint">${esc(s.summary)}</p><p>En attente que l'hôte lance la partie.</p></section>`;
  }
  return `<header class="section">
    <span class="eyebrow">Lobby · ${v.players.length} joueur${v.players.length > 1 ? "s" : ""}</span>
    <div class="code-big">${esc(v.code)}</div>
    <div class="share"><code id="o-link">${esc(shareLink(v.code))}</code><button class="btn-small" data-act="o-copy">${O.copied ? "Lien copié" : "Copier le lien"}</button></div>
  </header>
  <section class="section"><span class="label">Joueurs</span><div class="scores">${plist}</div></section>
  ${rulesBlock(s.game)}
  ${settings}
  ${scoreBlock(v)}
  ${leaveBlock(v)}`;
}
const waitHost = `<p class="hint">En attente de l'hôte.</p>`;

function vOUc(v) {
  const g = v.game;
  const myCard = !g.inGame ? `<div class="banner warn">Tu as rejoint pendant la partie : tu joueras à la prochaine.</div>` : `<div class="card">
      <span class="eyebrow">${g.alive ? "Ton mot" : "Tu es éliminé · ton mot"}</span>
      ${O.revealMine ? (g.white ? `<div class="word">Mr. White</div><p class="white-note">Tu n'as pas de mot. Écoute les autres et bluffe.</p>` : `<div class="word">${esc(g.word)}</div>`) : `<span class="redact" aria-hidden="true">██████</span>`}
      <button class="btn-small" data-act="o-reveal" style="background:var(--ink)">${O.revealMine ? "Cacher" : "Afficher mon mot"}</button>
    </div>`;
  const note = g.note ? `<div class="banner warn">${esc(g.note)}</div>` : "";
  if (g.phase === "talk") {
    return `<header class="section"><span class="eyebrow">Tour ${g.round} · thème ${esc(g.theme)}</span><h2>Chacun donne un indice</h2>
      <p class="lead">Un mot ou une phrase courte pour décrire ton mot sans le dire. Dans cet ordre :</p></header>
      ${note}${myCard}
      <ol class="order">${g.order.map(n => `<li><span>${esc(n)}</span></li>`).join("")}</ol>
      ${v.isHost ? `<button class="btn" data-act="o-send" data-a="uc-tovote">Passer au vote</button>` : `<p class="hint">L'hôte lance le vote quand tout le monde a parlé.</p>`}
      ${leaveBlock(v)}`;
  }
  if (g.phase === "vote") {
    const done = g.list.filter(p => p.alive && p.voted).length, total = g.list.filter(p => p.alive).length;
    let mine;
    if (!g.alive) mine = `<p class="hint">Tu es éliminé : tu ne votes pas.</p>`;
    else if (g.myVote) mine = `<div class="banner">Tu as voté contre ${esc(g.myVote)}.</div>`;
    else {
      const choices = g.list.filter(p => p.alive && p.pid !== v.me);
      const sel = choices.find(p => p.pid === O.sel);
      mine = `<div class="vote">${choices.map(p => `<button data-act="o-sel" data-x="${p.pid}" aria-pressed="${O.sel === p.pid}"><span>${esc(p.name)}</span></button>`).join("")}</div>
        ${sel ? `<button class="btn btn-danger" data-act="o-send" data-a="uc-vote" data-x="${sel.pid}">Voter contre ${esc(sel.name)}</button>` : ""}`;
    }
    return `<header class="section"><span class="eyebrow">Tour ${g.round} · vote</span><h2>Qui est l'intrus ?</h2>
      <p class="lead">Chacun vote sur son téléphone. Votes reçus : ${done}/${total}.</p></header>
      ${mine}
      <section class="section"><span class="label">Ont voté</span><div class="scores">${g.list.filter(p => p.alive).map(p => `<div class="score-row"><span>${esc(p.name)}</span><b class="${p.voted ? "voted" : ""}">${p.voted ? "a voté" : "…"}</b></div>`).join("")}</div></section>
      ${v.isHost && done < total ? `<button class="btn-ghost" data-act="o-send" data-a="uc-force">Dépouiller sans attendre</button>` : ""}
      ${myCard}`;
  }
  const votes = g.lastVotes && g.lastVotes.length ? `<section class="section"><span class="label">Les votes</span><div class="scores">${g.lastVotes.map(([a, b]) => `<div class="score-row"><span>${esc(a)}</span><b>→ ${esc(b)}</b></div>`).join("")}</div></section>` : "";
  if (g.phase === "out") {
    const civ = g.out.role === "civil";
    return `<header class="section"><span class="eyebrow">Tour ${g.round} · résultat du vote</span><h2>${esc(g.out.name)} est éliminé</h2></header>
      <div class="card"><div class="stamp ${civ ? "civil" : ""}">${ROLE_LABEL[g.out.role]}</div><p>${civ ? "Raté, c'était un civil." : "Bien joué, l'Undercover est démasqué."}</p></div>
      ${votes}
      ${v.isHost ? `<button class="btn" data-act="o-send" data-a="uc-continue">Continuer</button>` : waitHost}`;
  }
  if (g.phase === "white") {
    const meWhite = g.out.pid === v.me;
    let body;
    if (g.val) {
      body = valBlock(g.val, `Mr. White propose « ${esc(g.val.data.guess)} »`, g.val.canVote ? `Le mot des civils est <b>${esc(g.val.data.word)}</b>. Sa réponse compte-t-elle ?` : "");
    } else if (!g.whiteGuess) {
      body = meWhite
        ? `<p class="lead">Dernière chance : devine le mot des civils pour gagner seul.</p>
           <input type="text" id="o-guess" data-o="guess" value="${esc(O.guess)}" placeholder="Le mot des civils…" autocomplete="off">
           <button class="btn" data-act="o-send" data-a="uc-guess" data-from="guess">Valider ma réponse</button>`
        : `<p class="lead">${esc(g.out.name)} tente de deviner le mot des civils sur son téléphone…</p>`;
    } else {
      body = `<div class="card"><div class="stamp civil">Raté</div><p>${esc(g.out.name)} a proposé « ${esc(g.whiteGuess.text)} ».</p></div>
        ${v.isHost ? `<button class="btn" data-act="o-send" data-a="uc-continue">Continuer</button>` : waitHost}`;
    }
    return `<header class="section"><span class="eyebrow">Tour ${g.round} · résultat du vote</span><h2>${esc(g.out.name)} était Mr. White</h2></header>
      ${body}${votes}`;
  }
  const e = g.end;
  const title = { civils: "Les civils gagnent", impostors: "L'Undercover gagne", white: "Mr. White gagne" }[e.winner];
  return `<header class="section"><span class="eyebrow">Fin de partie · thème ${esc(g.theme)}</span><h1 style="font-size:3rem">${title}</h1></header>
    ${g.whiteGuess && g.whiteGuess.ok ? `<div class="banner">${esc(g.out.name)} a trouvé le mot des civils : « ${esc(g.whiteGuess.text)} ».</div>` : ""}
    <div class="card">
      <div class="row" style="width:100%">
        <div><span class="eyebrow">Mot civil</span><div class="word" style="font-size:2rem">${esc(e.civil)}</div></div>
        <div><span class="eyebrow">Mot undercover</span><div class="word" style="font-size:2rem;color:var(--stamp)">${esc(e.ucw)}</div></div>
      </div>
      <div class="recap">${e.roles.map(p => `<div class="recap-row"><span class="${p.alive ? "" : "out"}">${esc(p.name)}</span><span class="role-tag ${p.role === "uc" ? "uc" : p.role === "white" ? "mw" : ""}">${ROLE_LABEL[p.role]}</span></div>`).join("")}</div>
    </div>
    ${scoreBlock(v)}
    ${v.isHost ? `<button class="btn" data-act="o-send" data-a="again">Rejouer</button><button class="btn-ghost" data-act="o-send" data-a="lobby">Retour au lobby</button>` : waitHost}`;
}

function vOQs(v) {
  const g = v.game;
  if (g.phase === "pick") {
    let body;
    if (g.target && !g.target.validated) {
      const t = g.target;
      body = `<header class="section"><span class="eyebrow">Choix des persos · ${g.done}/${g.total} validés</span>

/* ---------- Tu préfères en ligne (hôte) ---------- */
function tpStart() {
  const ps = L.players.filter(p => p.online);
  if (ps.length < 2) { L.note = "Il faut au moins 2 joueurs connectés pour Tu préfères."; return; }
  const st = L.settings.tp;
  const all = tpAll(st.packs);
  if (!all.length) { L.note = "Choisis au moins un thème."; return; }
  let pool = all.filter(q => !L.tpUsed.has(q.join("|")));
  if (pool.length < st.rounds) { L.tpUsed.clear(); pool = all; }
  const deck = shuffle(pool).slice(0, st.rounds);
  deck.forEach(q => L.tpUsed.add(q.join("|")));
  L.game = { kind: "tp", phase: "vote", round: 1, rounds: deck.length, deck, players: ps.map(p => p.pid), votes: {}, minority: {}, hist: [] };
}
function tpVote(pid, x) {
  const g = L.game;
  if (!g || g.kind !== "tp" || g.phase !== "vote" || !g.players.includes(pid) || !["a", "b"].includes(x)) return;
  g.votes[pid] = x;
  if (g.players.every(p => g.votes[p] || !(L.players.find(q => q.pid === p) || {}).online)) tpReveal();
}
function tpReveal() {
  const g = L.game;
  const a = g.players.filter(p => g.votes[p] === "a"), b = g.players.filter(p => g.votes[p] === "b");
  if (a.length !== b.length && a.length && b.length) (a.length < b.length ? a : b).forEach(p => g.minority[p] = (g.minority[p] || 0) + 1);
  g.hist.push({ q: g.deck[g.round - 1], a: a.length, b: b.length });
  g.phase = "reveal";
}
function tpNext() {
  const g = L.game;
  if (g.round >= g.rounds) { g.phase = "end"; return; }
  g.round++; g.votes = {}; g.phase = "vote";
}
function tpView(g, pid) {
  const v = { kind: "tp", phase: g.phase, round: g.round, rounds: g.rounds, q: g.deck[g.round - 1], inGame: g.players.includes(pid), myVote: g.votes[pid] || null };
  v.count = Object.keys(g.votes).length; v.total = g.players.length;
  v.waiting = g.players.filter(p => !g.votes[p]).map(pname);
  if (g.phase !== "vote") {
    v.a = g.players.filter(p => g.votes[p] === "a").map(pname);
    v.b = g.players.filter(p => g.votes[p] === "b").map(pname);
  }
  if (g.phase === "end") {
    v.orig = g.players.map(p => [pname(p), g.minority[p] || 0]).sort((x, y) => y[1] - x[1]);
    v.hist = g.hist;
  }
  return v;
}

const SEPT_POP_OUT = ["Roblox", "Minecraft", "Fortnite", "Brawl Stars", "Clash Royale", "Among Us", "Subway Surfers", "Geometry Dash", "TikTok", "YouTube", "Instagram", "PlayStation", "Nintendo Switch", "McDonald's", "Nutella", "KPop Demon Hunters", "Mario", "Sonic", "Ladybug"];

let SM = { screen: "setup", cards: [], found: [], used: 0, round: 0, results: [], msg: "", seen: new Set() };
function septCat(c) {
  const out = [], seen = new Set();
  const add = it => { const k = norm(it.w); if (seen.has(k) || (c.out || []).includes(it.w)) return; seen.add(k); out.push(Object.assign({}, it, { c: it.c })); };

}

}

  const pool = septPool();

    return { x: ox + (small ? (Math.random() - .5) * 200 : 0), y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * (small ? .5 : 1), r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: boom ? 6 + Math.random() * 6 : 3 + Math.random() * 4, c: cols[Math.floor(Math.random() * cols.length)] };

    case "open": G.revealOpen = true; break;
    case "next":
      G.revealOpen = false;
      if (G.revealIdx < G.players.length - 1) G.revealIdx++;
      else ui.screen = "talk";
      break;
    case "peek": ui.peek = +b.dataset.i; ui.peekOpen = true; break;
    case "peekClose": ui.peek = null; ui.peekOpen = false; break;
    case "toVote": ui.screen = "vote"; ui.peek = null; ui.peekOpen = false; break;
    case "backTalk": ui.screen = "talk"; ui.voteSel = null; G.round++; G.order = speakOrder(); break;
    case "sel": ui.voteSel = +b.dataset.i; break;
    case "unsel": ui.voteSel = null; break;
    case "kill": return eliminate(ui.voteSel);
    case "continue": return afterOutcome();
    case "guess": {
      const v = document.getElementById("guess").value.trim();
      if (!v) return;
      G.whiteGuess = { text: v, ok: norm(v) === norm(G.civilWord) };
      break;
    }
    case "whiteWin": return endGame("white");
    case "again": return startGame();
    case "menu": case "quit": G = null; ui.screen = "setup"; break;

    /* devine tête */
    case "d-count": {
      dcfg.count = Math.min(10, Math.max(2, dcfg.count + +b.dataset.d));
      while (dcfg.names.length < dcfg.count) dcfg.names.push("");
      dSave(); break;
    }
    case "d-cat": {
      const id = b.dataset.id;
      if (id === "all") dcfg.cats = ["all"];
      else {
        let t = dcfg.cats.filter(x => x !== "all");
        t = t.includes(id) ? t.filter(x => x !== id) : t.concat(id);
        dcfg.cats = t.length ? t : ["all"];
      }
      dSave(); break;
    }
    case "d-sound": case "sound": prefs.sound = !prefs.sound; prefsSave(); if (prefs.sound) { initAudio(); beep(880, .08, "triangle", .12); } break;
    case "d-new": initAudio(); dNewGame(); setLast("dt", "local"); break;
    case "d-setup": D.screen = "setup"; break;
    case "d-assign": dStartAssign(); break;
    case "d-reroll": dReroll(); break;
    case "d-custom": dCustom(); break;
    case "d-validate": dValidate(); break;
    case "d-reveal": D.reveal = !D.reveal; break;
    case "d-asked": dAsked(); break;
    case "d-found": dFound(); break;
    case "d-afterFound": dAfterFound(); break;
    case "d-askEnd": D.confirmEnd = true; break;
    case "d-cancelEnd": D.confirmEnd = false; break;
    case "d-finish": dFinish(); break;
  }
  render();
}

/* Garde la partie si la page est mise à jour pendant qu'on joue */
if (window.claude?.hot?.snapshot) window.claude.hot.snapshot(() => ({ S, cfg, G, ui, used: [...used], dcfg, D, dUsed: [...dUsed] }));
const views_ok = sc => ["setup", "assignReady", "assignPick", "turn", "found", "end"].includes(sc);
function boot(d) {
  if (d && d.cfg && d.S) {
    S = d.S; cfg = d.cfg; G = d.G; ui = d.ui; used = new Set(d.used || []);
    if (d.dcfg) dcfg = d.dcfg;
    if (d.D) D = d.D;
    dUsed = new Set(d.dUsed || []);
  }
  if (!G && ui.screen !== "setup") ui.screen = "setup";
  if (!D.wins) D.wins = {};
  if (O.code && QS.get("lobby") && ONLINE_OK) { S.view = "online"; ensureFb().catch(() => {}); }
  if (S.view === "online" && !NET.room) { O.screen = "entry"; O.view = null; }
  if (!views_ok(D.screen) || (!D.game && D.screen !== "setup")) { D.screen = "setup"; }
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
