<style>
/* Layout: une colonne façon "dossier d'agent", écran par écran ; le jeu en cours passe en plein écran */
:root {
  --bg: #1d2c8c;
  --panel: #25379c;
  --line: #3a4db3;
  --paper: #f4f3fb;
  --ink: #141a4d;
  --text: #f4f3fb;
  --muted: #b2b9ea;
  --signal: #ffd23f;
  --stamp: #e8434a;
  --good: #3fd48c;
  --warn: #ff8a3d;
  --good-soft: rgba(63, 212, 140, .16);
  --warn-soft: rgba(255, 138, 61, .16);
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { min-height: 100%; }
body { margin: 0; }
img { max-width: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
#app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; line-height: .95; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.4rem, 13vw, 3.6rem); letter-spacing: .01em; overflow-wrap: anywhere; }
h2 { overflow-wrap: anywhere; }
h2 { font-size: 2.2rem; }
p { margin: 0; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 10px; }
.label { font-weight: 700; font-size: .95rem; }

button { font: inherit; cursor: pointer; border: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.btn {
  background: var(--signal); color: var(--ink); font-weight: 700; font-size: 1.05rem;
  padding: 16px 20px; border-radius: 12px; width: 100%;
  box-shadow: 0 4px 0 #c79e12; transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c79e12; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text); border: 2px solid var(--line); border-radius: 12px; padding: 13px 18px; font-weight: 600; width: 100%; }
.btn-small { background: var(--panel); color: var(--text); border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: .9rem; }
.btn-danger { background: var(--stamp); color: #fff; box-shadow: 0 4px 0 #a92a30; }
.back { background: none; color: var(--muted); font-weight: 600; padding: 10px 0; min-height: 44px; align-self: flex-start; }

input[type=text], textarea {
  width: 100%; box-sizing: border-box; font: inherit; color: var(--ink);
  background: var(--paper); border: 0; border-radius: 10px; padding: 12px 14px;
}
textarea { min-height: 120px; resize: vertical; font-family: var(--f-mono); font-size: .9rem; }

.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 44px; height: 44px; border-radius: 10px; background: var(--panel); color: var(--text); font-size: 1.4rem; font-weight: 700; }
.stepper output { font-family: var(--f-display); font-size: 2.2rem; font-weight: 900; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }

.names { display: grid; gap: 8px; }
.name-row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.agent { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); letter-spacing: .08em; white-space: nowrap; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--panel); color: var(--text); border: 2px solid var(--line); border-radius: 999px; padding: 8px 14px; min-height: 42px; font-weight: 600; font-size: .92rem; transition: background .15s, border-color .15s, color .15s; }
.chip[aria-pressed=true] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.chip small { font-family: var(--f-mono); font-size: .7rem; opacity: .7; margin-left: 4px; }

.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--panel); border-radius: 12px; padding: 14px; }
.toggle .t-text { min-width: 0; }
.toggle .t-sub { color: var(--muted); font-size: .85rem; }
.switch { width: 58px; height: 34px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: var(--paper); transition: transform .15s; }
.switch[aria-checked=true] { background: var(--good); }
.switch[aria-checked=true]::after { transform: translateX(24px); }
.switch:disabled { opacity: .4; }

details.box { background: var(--panel); border-radius: 12px; padding: 14px; }
details.box summary { font-weight: 700; cursor: pointer; padding: 6px 0; min-height: 32px; }
details.box[open] summary { margin-bottom: 12px; }
.mytheme { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.mytheme span { min-width: 0; overflow-wrap: anywhere; }
.hint { font-size: .85rem; color: var(--muted); }
.msg { font-size: .9rem; color: var(--signal); min-height: 1.2em; }

/* Accueil */
.games { display: grid; gap: 12px; }
.game-card { text-align: left; background: var(--panel); color: var(--text); border: 2px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 6px; transition: border-color .12s, transform .12s; }
.game-card:hover { border-color: var(--signal); }
.game-card:active { transform: scale(.98); }
.game-card .gmeta { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; }
.game-card .gname { font-family: var(--f-display); font-weight: 900; font-size: 2.6rem; text-transform: uppercase; line-height: 1; }
.game-card .gdesc { color: var(--muted); }
.gm-uc { color: #ff9ba1; }
.gm-dt { color: var(--good); }

/* Carte / dossier */
.card {
  background: var(--paper); color: var(--ink); border-radius: 16px; padding: 24px 20px;
  display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center;
  position: relative; overflow: hidden;
}
.card .eyebrow { color: #5a6199; }
.card .who { font-family: var(--f-display); font-weight: 900; font-size: 2.6rem; text-transform: uppercase; line-height: 1; overflow-wrap: anywhere; }
.word { font-family: var(--f-display); font-weight: 900; font-size: 3.4rem; text-transform: uppercase; line-height: 1; overflow-wrap: anywhere; }
.redact { display: inline-block; background: var(--ink); color: var(--ink); border-radius: 4px; padding: 6px 18px; font-family: var(--f-display); font-weight: 900; font-size: 3rem; line-height: 1; user-select: none; }
.white-note { color: #5a6199; font-size: .95rem; max-width: 30ch; }

.stamp {
  font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: 2.4rem;
  color: var(--stamp); border: 4px solid var(--stamp); border-radius: 8px; padding: 4px 14px;
  transform: rotate(-6deg); letter-spacing: .03em; animation: stamp .35s cubic-bezier(.2,1.6,.4,1) both;
}
.stamp.civil { color: #1f9a5e; border-color: #1f9a5e; }
@keyframes stamp { from { transform: rotate(-6deg) scale(1.8); opacity: .3; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }

.progress { display: flex; gap: 6px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress i.done { background: var(--signal); }

.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: o; }
.order li { counter-increment: o; display: grid; grid-template-columns: 2.4rem 1fr; align-items: center; background: var(--panel); border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.order li::before { content: counter(o); font-family: var(--f-display); font-weight: 900; font-size: 1.6rem; color: var(--signal); }
.order li span { min-width: 0; overflow-wrap: anywhere; }

.vote { display: grid; gap: 8px; }
.vote button { text-align: left; background: var(--panel); color: var(--text); border: 2px solid var(--line); border-radius: 12px; padding: 14px; font-weight: 700; font-size: 1.05rem; display: flex; justify-content: space-between; gap: 10px; }
.vote button[aria-pressed=true] { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.vote button span { min-width: 0; overflow-wrap: anywhere; }

.recap { display: grid; gap: 6px; width: 100%; text-align: left; }
.recap-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 8px 0; border-top: 1px solid #d9d8ea; }
.recap-row span:first-child { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.role-tag { font-family: var(--f-mono); font-size: .75rem; padding: 3px 8px; border-radius: 6px; background: #e3e2f1; white-space: nowrap; }
.role-tag.uc { background: var(--stamp); color: #fff; }
.role-tag.mw { background: var(--ink); color: var(--paper); }
.out { text-decoration: line-through; opacity: .55; }

.scores { display: grid; gap: 4px; }
.score-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.score-row span:first-child { min-width: 0; overflow-wrap: anywhere; }
.score-row b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.score-row.lead-row span:first-child { color: var(--signal); font-weight: 700; }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.confirm { background: var(--panel); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }

/* Devine Tête : scène plein écran */
.stage {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: flex; flex-direction: column; gap: 10px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  transition: background .15s;
}
.stage.flash-ok { background: #1f9a5e; }
.stage.flash-ko { background: #c2571c; }
.stage-top { display: flex; align-items: center; gap: 12px; }
.timer { font-family: var(--f-display); font-weight: 900; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2.6ch; }
.timer.hot { color: #ff7a80; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--signal); }
.stage-score { font-family: var(--f-mono); font-size: .85rem; white-space: nowrap; }
.stop { background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: .85rem; font-weight: 600; }
.zones { flex: 1; position: relative; display: grid; grid-template-rows: 1fr 1fr; gap: 8px; min-height: 0; }
.zone { border-radius: 16px; font-family: var(--f-mono); font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; display: flex; justify-content: center; padding: 14px; touch-action: manipulation; }
.zone.ok { background: var(--good-soft); color: var(--good); align-items: flex-start; }
.zone.ko { background: var(--warn-soft); color: var(--warn); align-items: flex-end; }
.big-word { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; padding: 0 12px; gap: 10px; }
.big-word b { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; line-height: .95; font-size: min(15vw, 17vh); overflow-wrap: anywhere; text-wrap: balance; max-width: 100%; }
.big-word span { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.countdown { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
.countdown b { font-family: var(--f-display); font-weight: 900; font-size: min(45vw, 45vh); line-height: 1; color: var(--signal); }

.how { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.how div { border-radius: 12px; padding: 12px; font-size: .9rem; }
.how .h-ok { background: var(--good-soft); color: var(--good); }
.how .h-ko { background: var(--warn-soft); color: var(--warn); }
.how b { display: block; font-family: var(--f-mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; }

.big-score { font-family: var(--f-display); font-weight: 900; font-size: 5rem; line-height: 1; color: var(--signal); }
.reslist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.reslist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--panel); font-weight: 600; }
.reslist li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.reslist li .tag { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.reslist li.ok .tag { color: var(--good); }
.reslist li.ko { opacity: .55; }
.reslist li.ko .tag { color: var(--warn); }

.face { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; min-height: 0; padding: 0 8px; }
.face b { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; line-height: .95; font-size: min(16vw, 20vh); overflow-wrap: anywhere; text-wrap: balance; max-width: 100%; }
.face span { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.stage > .bar { flex: none; }
.play-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.act-ok { background: var(--good); color: var(--ink); font-weight: 700; font-size: 1.2rem; padding: 18px; border-radius: 14px; }
.act-ko { background: var(--warn-soft); color: var(--warn); font-weight: 700; padding: 18px; border-radius: 14px; }

.gm-on { color: var(--signal); }
.gm-lg { color: #ffa6c9; }
.quickjoin { display: flex; flex-direction: column; gap: 8px; }
.qj-row { display: flex; gap: 8px; }
.qj-row input { flex: 1; min-width: 0; }
.qj-row .btn { width: auto; padding: 12px 18px; }
.home-head { display: flex; flex-direction: column; gap: 6px; }
.home-head h1 { font-size: clamp(3rem, 17vw, 4.4rem); letter-spacing: .02em; }
.home-head .lead { font-family: var(--f-mono); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
article.game-card { cursor: default; display: grid; grid-template-columns: minmax(0, 1fr) 80px; column-gap: 14px; row-gap: 4px; align-items: start; padding: 18px; }
article.game-card:hover { border-color: var(--line); }
article.game-card:active { transform: none; }
article.game-card > :not(.gart) { grid-column: 1; }
.gart { grid-column: 2; grid-row: 1 / span 3; }
.gart svg { width: 80px; height: 80px; display: block; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .3)); }
.game-card .gname { font-size: clamp(1.9rem, 9vw, 2.6rem); min-width: 0; overflow-wrap: anywhere; }
.game-card .gdesc { font-size: .95rem; }
article.game-card > .modes { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
article.game-card > .modes.single { grid-template-columns: 1fr; }
.mode-btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; background: var(--paper); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 1rem; box-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
.mode-btn svg { width: 20px; height: 20px; flex: none; }
.mode-btn.on { background: var(--signal); }
.mode-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
.code-big { font-family: var(--f-display); font-weight: 900; font-size: 4.4rem; letter-spacing: .18em; line-height: 1; color: var(--signal); }
.code-input { text-transform: uppercase; letter-spacing: .3em; font-family: var(--f-mono); font-size: 1.2rem; }
.share { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.share code { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; min-width: 0; flex: 1 1 200px; }
.banner { background: var(--good-soft); color: var(--good); border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.qs-list { display: grid; gap: 8px; }
.qs-row { background: var(--panel); border: 2px solid transparent; border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.qs-row.cur { border-color: var(--signal); }
.qs-row.found { opacity: .6; }
.qs-row .who-n { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.qs-row .meta { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); white-space: nowrap; }
.qs-row .pick { grid-column: 1 / -1; font-family: var(--f-display); font-weight: 900; font-size: 1.9rem; text-transform: uppercase; line-height: 1; overflow-wrap: anywhere; }
.qs-row .pick.hidden { color: var(--muted); }
.voted { color: var(--good); }
.val-box { background: var(--panel); border: 2px solid var(--signal); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.val-box > b { font-size: 1.15rem; overflow-wrap: anywhere; }
.val-box p { margin: 0; }
.val-count { display: flex; gap: 12px; font-family: var(--f-mono); font-size: .85rem; color: var(--muted); }
.val-count .ok { color: var(--good); }
.val-count .ko { color: var(--warn); }
.val-box button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--paper); }
.gm-qd { color: #c9a2ff; }
.gm-dr { color: #8fd0ff; }
.qd-cards { display: grid; gap: 10px; }
.qd-card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.qd-card.mine { border-style: dashed; opacity: .8; }
.qd-card p { margin: 0; font-size: 1.1rem; font-weight: 600; overflow-wrap: anywhere; }
.qd-author { font-family: var(--f-display); font-size: 1.6rem; text-transform: uppercase; color: var(--signal); }
.qd-guesses { display: flex; flex-wrap: wrap; gap: 6px; }
.qd-guesses span { font-size: .82rem; padding: 3px 9px; border-radius: 999px; background: var(--bg); }
.qd-guesses .ok { color: var(--good); }
.qd-guesses .ko { color: var(--warn); }
#o-qd { min-height: 90px; font-family: var(--f-body); font-size: 1rem; }
.dr-word { background: var(--paper); color: var(--ink); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.dr-word .eyebrow { color: #5a6199; }

/* Loup-Garou : décors nuit / jour */
body { transition: background-color .9s ease, color .9s ease; }
body[data-scene="night"] { --bg: #0b1030; --panel: #161d4c; --line: #2a3474; --muted: #a3acdf; }
body[data-scene="day"] { --bg: #f2e6c9; --panel: #e5d4ab; --line: #cdb98a; --text: #2b2116; --muted: #6e5b3f; --good: #1f8a54; --warn: #b85a12; --good-soft: rgba(31, 138, 84, .14); --warn-soft: rgba(184, 90, 18, .14); }
body[data-scene="day"] .btn-small { color: var(--text); }
.lg { display: flex; flex-direction: column; gap: 18px; }
.lg-scene { display: block; width: 100%; height: auto; max-width: 100%; aspect-ratio: 400 / 150; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
.lg-star { fill: #fff; animation: lg-tw 3.2s ease-in-out infinite; }
@keyframes lg-tw { 50% { opacity: .2; } }
.lg-bar { display: flex; gap: 8px; flex-wrap: wrap; }
.lg-bar .btn-small[aria-pressed="false"] { opacity: .7; }
.lg-peek { display: flex; flex-direction: column; gap: 8px; }

/* Cartes de rôle */
.lg-card {
  background: radial-gradient(120% 90% at 50% 15%, rgba(255, 255, 255, .16), transparent 60%), var(--rc);
  color: #f7f4ff; border-radius: 18px; padding: 22px 18px 20px; display: flex; flex-direction: column; align-items: center;
  text-align: center; gap: 8px; position: relative; overflow: hidden;
  box-shadow: 0 12px 30px rgba(0, 0, 0, .35), inset 0 0 0 3px rgba(255, 255, 255, .1);
}
.lg-card::before { content: ""; position: absolute; inset: 8px; border: 1.5px solid rgba(255, 255, 255, .22); border-radius: 12px; pointer-events: none; }
.lg-art svg { width: 140px; height: 140px; display: block; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .35)); }
.lg-name { font-family: var(--f-display); font-weight: 900; font-size: 2.3rem; text-transform: uppercase; line-height: 1; letter-spacing: .01em; }
.lg-team { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: rgba(0, 0, 0, .3); }
.lg-desc { font-size: .95rem; opacity: .92; max-width: 32ch; margin: 0; }
.lg-card.sm { padding: 14px 12px; gap: 6px; }
.lg-card.sm .lg-art svg { width: 76px; height: 76px; }
.lg-card.sm .lg-name { font-size: 1.4rem; }
.lg-mini { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 600; background: var(--rc); color: #f7f4ff; padding: 3px 9px 3px 4px; border-radius: 999px; }
.lg-mini svg { width: 22px; height: 22px; }
.lg-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--rc); color: #f7f4ff; padding: 5px 12px 5px 5px; border-radius: 999px; font-weight: 600; font-size: .88rem; }
.lg-chip svg { width: 28px; height: 28px; }
.lg-comp { display: flex; flex-wrap: wrap; gap: 8px; }
.lg-rolechip { display: inline-flex; align-items: center; gap: 6px; padding-left: 6px; }
.lg-rolechip svg { width: 24px; height: 24px; }

/* Carte qui se retourne */
.flip { perspective: 1200px; cursor: pointer; }
.flip-in { position: relative; min-height: 400px; transition: transform .8s cubic-bezier(.2, .8, .2, 1); transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.flip-front, .flip-back { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip-back { transform: rotateY(180deg); }
.flip-back .lg-card { height: 100%; box-sizing: border-box; justify-content: center; }
.flip-front {
  border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #dfe3ff;
  background: repeating-linear-gradient(45deg, #1b2260 0 14px, #18205a 14px 28px); border: 3px solid #2d3780; box-shadow: 0 12px 30px rgba(0, 0, 0, .35);
}
.flip-front svg { width: 150px; height: 150px; }

.lg-tally { display: grid; gap: 6px; }

.lg-endcard span { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.lg-log { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: .9rem; }
.lg-force { opacity: .75; }

.lg-roleopt { display: grid; grid-template-columns: 52px minmax(0, 1fr) 28px; align-items: center; gap: 12px; text-align: left; background: var(--panel); color: var(--text); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.lg-roleopt.base { grid-template-columns: 52px minmax(0, 1fr); background: var(--bg); }
.lg-roleopt.on { border-color: var(--signal); background: color-mix(in srgb, var(--rc) 55%, var(--panel)); }
.lg-ro-art { width: 52px; height: 52px; border-radius: 12px; background: var(--rc); display: flex; align-items: center; justify-content: center; }
.lg-ro-art svg { width: 42px; height: 42px; }

.stepper .btn-small { width: auto; height: auto; font-size: .9rem; padding: 10px 14px; }
.btn-small[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
.vote button:disabled { opacity: .4; cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) { .flip-in { transition: none; } .lg-star { animation: none; } body { transition: none; } }

@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#app.enter > * { animation: enter .26s cubic-bezier(.2, .8, .2, 1) both; }

function imgSchedule(fn) { imgQueue.push(fn); imgPump(); }
function imgPump() {

let jikanNext = 0;
async function jikanFind(q) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const wait = Math.max(0, jikanNext - Date.now());
    jikanNext = Math.max(Date.now(), jikanNext) + 500;
    if (wait) await new Promise(r => setTimeout(r, wait));
    const r = await fetch(`https://api.jikan.moe/v4/characters?q=${encodeURIComponent(q)}&order_by=favorites&sort=desc&limit=1`);
    if (r.status === 429) { jikanNext = Date.now() + 1500; continue; }
    if (!r.ok) return null;
    const d = ((await r.json()).data || [])[0];
    const url = d && d.images && ((d.images.jpg && d.images.jpg.image_url) || (d.images.webp && d.images.webp.image_url));
    return url && !/questionmark/i.test(url) ? { url, page: d.url, credit: "MyAnimeList" } : null;
  }
  return null;
}
async function wikiApi(lang, params) {
  const r = await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=360&pilicense=any&redirects=1&${params}`);
  if (!r.ok) return [];
  const j = await r.json();
  return Object.values((j.query && j.query.pages) || {}).sort((a, b) => (a.index || 0) - (b.index || 0));
}
const wikiHit = (lang, p) => ({ url: p.thumbnail.source, page: `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(p.title.replace(/ /g, "_"))}`, credit: "Wikipédia" });
async function wikiFind(it) {
  const core = imgWords(it.q.replace(/\s*\(.*\)\s*/g, " "));
  for (const lang of it.lang) {
    const direct = await wikiApi(lang, "titles=" + encodeURIComponent(it.q));
    const d = direct.find(p => p.thumbnail && !p.missing);
    if (d) return wikiHit(lang, d);
    const found = await wikiApi(lang, `generator=search&gsrnamespace=0&gsrlimit=6&gsrsearch=${encodeURIComponent((it.q + " " + it.hint).trim())}`);
    const s = found.find(p => p.thumbnail && imgWords(p.title).includes(core));
    if (s) return wikiHit(lang, s);
  }
  return null;
}

function loadImg(key, it) {
  const direct = imgFor(it);
  if (direct) { IMG[key] = direct; return; }
  const cached = store.get("img2_" + key, undefined);
  if (cached !== undefined) { IMG[key] = cached; return; }
  IMG[key] = "pending";
  imgSchedule(async () => {
    let res = null;
    try { res = it.s === "anime" ? await jikanFind(it.q) : await wikiFind(it); } catch (e) { res = null; }
    if (!res && it.s === "anime") { try { res = await wikiFind({ q: it.q, lang: ["en", "fr"], hint: "character" }); } catch (e) {} }
    IMG[key] = res;
    store.set("img2_" + key, res);
    scheduleRender();
  });
}
function avatar(name, cls) {
  const n = String(name || "?");
  let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) % 360;
  const ini = n.split(/[\s'-]+/).filter(Boolean).slice(0, 2).map(x => x[0]).join("").toUpperCase();
  return `<div class="${cls} char-avatar" style="--h:${h}" aria-hidden="true">${esc(ini)}</div>`;
}
function charImg(pick, cls) {
  if (!pick) return "";
  const c = cls || "char-img";
  if (pick.img && PHOTO_RE.test(pick.img)) return `<img class="${c}" src="${pick.img}" alt="">`;
  const it = itemFor(pick);
  if (!it) return avatar(pick.w, c);
  if (CUR.bad.includes(dtKey(catIdByName(pick.c), pick.w))) return avatar(pick.w, c);
  const key = (pick.c || "") + "|" + pick.w;
  if (IMG[key] === undefined) loadImg(key, it);
  const r = IMG[key];
  if (r === "pending") return `<div class="${c} char-loading" aria-hidden="true"></div>`;
  if (!r) return avatar(pick.w, c);
  const img = `<img class="${c}" src="${esc(r.url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=this.dataset.fb" data-fb="${esc(avatar(pick.w, c))}">`;
  if (c !== "char-img") return img;
  return `<figure class="char-fig">${img}<figcaption>${r.page ? `<a href="${esc(r.page)}" target="_blank" rel="noopener">Image : ${esc(r.credit)}</a>` : `Image : ${esc(r.credit)}`}</figcaption></figure>`;
}

function readPhoto(file, cb) {
  if (!file || !/^image\//.test(file.type)) return cb(null);
  const r = new FileReader();
  r.onerror = () => cb(null);
  r.onload = () => {
    const im = new Image();
    im.onerror = () => cb(null);
    im.onload = () => {
      const k = Math.min(1, 256 / Math.max(im.width, im.height));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(im.width * k)); cv.height = Math.max(1, Math.round(im.height * k));
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL("image/jpeg", 0.72));
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}

function pickPair() {
  const pool = [];
  const sel = cfg.themes.includes("all") ? allThemes() : allThemes().filter(t => cfg.themes.includes(t.id));
  sel.forEach(t => ucPairs(t).forEach(p => pool.push({ theme: t.name, pair: p })));
  if (!pool.length) return null;
  let fresh = pool.filter(x => !used.has(x.pair.join("|")));
  if (!fresh.length) { used.clear(); fresh = pool; }
  const pick = fresh[Math.floor(Math.random() * fresh.length)];
  used.add(pick.pair.join("|"));
  const flip = Math.random() < .5;
  return { theme: pick.theme, civil: flip ? pick.pair[1] : pick.pair[0], uc: flip ? pick.pair[0] : pick.pair[1] };
}

function startGame() {
  oKeepAwake();
  const p = pickPair();
  if (!p) { ui.msg = "Choisis au moins un thème qui contient des mots."; render(); return; }
  const n = cfg.count;
  const useWhite = cfg.white && n >= 4;
  const roles = Array(n).fill("civil");
  const idx = shuffle([...Array(n).keys()]);
  roles[idx[0]] = "uc";
  if (n >= 7) roles[idx[1]] = "uc";
  if (useWhite) roles[idx[n >= 7 ? 2 : 1]] = "white";
  G = {
    theme: p.theme, civilWord: p.civil, ucWord: p.uc, round: 1,
    players: roles.map((r, i) => ({ name: nameOf(i), role: r, word: r === "civil" ? p.civil : r === "uc" ? p.uc : null, alive: true })),
    revealIdx: 0, revealOpen: false, order: [], lastOut: null, winner: null, whiteGuess: null, scored: false
  };
  G.order = speakOrder();
  ui = { screen: "reveal", msg: "", voteSel: null, confirmReset: false, peek: null, peekOpen: false };
  render();
}

function speakOrder() {
  let o = shuffle(G.players.map((p, i) => i).filter(i => G.players[i].alive));
  if (o.length > 1 && G.players[o[0]].role === "white") o.push(o.shift());
  return o;
}

function eliminate(i) {
  G.players[i].alive = false;
  G.lastOut = i;
  ui.voteSel = null;
  ui.screen = G.players[i].role === "white" ? "whiteGuess" : "outcome";
  render();
}

function checkWin() {
  const alive = G.players.filter(p => p.alive);
  const civ = alive.filter(p => p.role === "civil").length;
  const imp = alive.length - civ;
  if (imp === 0) return "civils";
  if (civ <= 1) return "impostors";
  return null;
}

function afterOutcome() {
  const w = checkWin();
  if (w) return endGame(w);
  G.round++;
  G.order = speakOrder();
  ui.screen = "talk"; render();
}

function endGame(w) {
  G.winner = w;
  if (!G.scored) {
    G.players.forEach(p => {
      let pts = 0;
      if (w === "civils" && p.role === "civil") pts = POINTS.civil;
      if (w === "impostors" && p.alive && p.role !== "civil") pts = POINTS[p.role];
      if (w === "white" && p.role === "white") pts = POINTS.white;
      scores[p.name] = (scores[p.name] || 0) + pts;
    });
    G.scored = true;
    store.set("scores", scores);
  }
  ui.screen = "end"; render();
}

let dcfg = Object.assign({ count: 3, names: ["", "", ""], cats: ["all"], sound: true }, store.get("dcfg", {}));
{ const ids = new Set(DT_CATS.map(c => c.id)); dcfg.cats = (dcfg.cats || []).filter(x => x === "all" || ids.has(x)); if (!dcfg.cats.length) dcfg.cats = ["all"]; }
let D = { screen: "setup", wins: {}, game: null, msg: "", draft: "", reveal: false, confirmEnd: false };
let dUsed = new Set();
let actx = null;

const dName = i => (dcfg.names[i] || "").trim() || "Joueur " + (i + 1);
const dSave = () => store.set("dcfg", dcfg);
const listNames = a => a.length <= 1 ? a.join("") : a.slice(0, -1).join(", ") + " et " + a[a.length - 1];
const othersOf = i => D.game.players.filter((p, j) => j !== i).map(p => p.name);
function stopTimers() {}
function releaseAwake() {}
function exitFullscreen() {}

function dPool() {
  const sel = dcfg.cats.includes("all") ? DT_CATS : DT_CATS.filter(c => dcfg.cats.includes(c.id));
  const out = [];
  sel.forEach(c => dtItems(c).forEach(it => out.push({ w: it.w, c: c.name })));
  return out;
}
function dDraw1() {
  const pool = dPool();
  const taken = D.game ? D.game.players.filter(p => p.pick).map(p => p.pick.w) : [];
  let fresh = pool.filter(x => !dUsed.has(x.w) && !taken.includes(x.w));
  if (!fresh.length) { dUsed.clear(); fresh = pool.filter(x => !taken.includes(x.w)); }
  if (!fresh.length) fresh = pool;
  const p = fresh[Math.floor(Math.random() * fresh.length)];
  dUsed.add(p.w);
  return Object.assign({}, p);
}
function initAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.resume) actx.resume(); } catch (e) { actx = null; } }
function beep(f, d = .12, type = "sine", vol = .2) {
  if (!dcfg.sound || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}

function dNewGame() {
  oKeepAwake();
  if (!dPool().length) { D.msg = "Choisis au moins une catégorie."; return; }
  D.game = {
    players: [...Array(dcfg.count).keys()].map(i => ({ name: dName(i), pick: null, rerolls: 0, found: false, q: 0, rank: null })),
    assign: 0, cur: 0, turn: 1, foundCount: 0, lastFound: null
  };
  D.reveal = false; D.confirmEnd = false; D.draft = "";
  D.screen = "assignReady";
}
function dStartAssign() {
  D.draftImg = null;
  const p = D.game.players[D.game.assign];
  if (!p.pick) p.pick = dDraw1();
  D.draft = "";
  D.screen = "assignPick";
}
function dReroll() { const p = D.game.players[D.game.assign]; p.pick = dDraw1(); p.rerolls++; }
function dCustom() {
  const t = (D.draft || "").trim();
  if (!t) { D.msg = "Écris un nom avant de valider."; return; }
  D.game.players[D.game.assign].pick = { w: t, c: "Choisi par " + listNames(othersOf(D.game.assign)), img: D.draftImg || null };
  D.draft = ""; D.draftImg = null;
}
function dValidate() {
  const g = D.game;
  g.assign++;
  if (g.assign < g.players.length) { D.screen = "assignReady"; return; }
  g.cur = Math.floor(Math.random() * g.players.length);
  D.reveal = false;
  D.screen = "turn";
}
function nextAlive(from) {
  const g = D.game, n = g.players.length;
  for (let k = 1; k <= n; k++) { const j = (from + k) % n; if (!g.players[j].found) return j; }
  return -1;
}
function dAsked() {
  const g = D.game;
  g.players[g.cur].q++;
  const nx = nextAlive(g.cur);
  if (nx <= g.cur) g.turn++;
  g.cur = nx;
  D.reveal = false;
}
function dFound() {
  const g = D.game, p = g.players[g.cur];
  initAudio();
  p.q++; p.found = true; p.rank = ++g.foundCount;
  g.lastFound = g.cur;
  beep(988, .12); setTimeout(() => beep(1318, .2), 100);
  D.reveal = false;
  D.screen = "found";
}
function dAfterFound() {
  const g = D.game;
  if (g.players.every(p => p.found)) return dFinish();
  const nx = nextAlive(g.lastFound);
  if (nx <= g.lastFound) g.turn++;
  g.cur = nx;
  D.screen = "turn";
}
function dFinish() {
  const g = D.game;
  const first = g.players.find(p => p.rank === 1);
  if (first && !g.scored) { D.wins[first.name] = (D.wins[first.name] || 0) + 1; g.scored = true; }
  D.confirmEnd = false; D.reveal = false;
  D.screen = "end";
}

/* ---------- Undercover en ligne (hôte) ---------- */
function ucStart() {
  const ps = L.players.filter(p => p.online);
  if (ps.length < 3) { L.note = "Il faut au moins 3 joueurs connectés pour l'Undercover."; return; }
  const sel = L.settings.themes.includes("all") ? allThemes() : allThemes().filter(t => L.settings.themes.includes(t.id));
  const pool = [];
  sel.forEach(t => ucPairs(t).forEach(p => pool.push({ theme: t.name, pair: p })));
  if (!pool.length) { L.note = "Choisis au moins un thème."; return; }
  let fresh = pool.filter(x => !L.used.has(x.pair.join("|")));
  if (!fresh.length) { L.used.clear(); fresh = pool; }
  const pk = fresh[Math.floor(Math.random() * fresh.length)];
  L.used.add(pk.pair.join("|"));
  const flip = Math.random() < .5;
  const civil = flip ? pk.pair[1] : pk.pair[0], ucw = flip ? pk.pair[0] : pk.pair[1];
  const n = ps.length, roles = Array(n).fill("civil"), idx = shuffle([...Array(n).keys()]);
  roles[idx[0]] = "uc";
  if (n >= 7) roles[idx[1]] = "uc";
  if (L.settings.white && n >= 4) roles[idx[n >= 7 ? 2 : 1]] = "white";
  L.game = {
    kind: "uc", theme: pk.theme, civil, ucw, round: 1, phase: "talk", votes: {}, lastVotes: {}, lastOut: null, note: "", whiteGuess: null, winner: null, scored: false,
    players: ps.map((p, i) => ({ pid: p.pid, role: roles[i], word: roles[i] === "civil" ? civil : roles[i] === "uc" ? ucw : null, alive: true }))
  };
  L.game.order = ucOrder(L.game);
}
function ucOrder(g) {
  const o = shuffle(g.players.filter(p => p.alive));
  if (o.length > 1 && o[0].role === "white") o.push(o.shift());
  return o.map(p => p.pid);
}
function ucVote(pid, target) {
  const g = L.game;
  if (!g || g.kind !== "uc" || g.phase !== "vote") return;
  const me = g.players.find(p => p.pid === pid), t = g.players.find(p => p.pid === target);
  if (!me || !me.alive || !t || !t.alive || t.pid === pid) return;
  g.votes[pid] = target;
  if (g.players.filter(p => p.alive).every(p => g.votes[p.pid])) ucTally();
}
function ucTally() {
  const g = L.game, counts = {};
  Object.values(g.votes).forEach(t => counts[t] = (counts[t] || 0) + 1);
  const max = Math.max(...Object.values(counts));
  const top = Object.keys(counts).filter(k => counts[k] === max);
  g.lastVotes = Object.assign({}, g.votes);
  g.votes = {};
  if (top.length > 1) {
    g.note = "Égalité entre " + listNames(top.map(pname)) + " : personne n'est éliminé. Nouveau tour d'indices.";
    g.round++; g.order = ucOrder(g); g.phase = "talk";
    return;
  }
  const p = g.players.find(x => x.pid === top[0]);
  p.alive = false;
  g.lastOut = p.pid;
  g.note = "";
  g.phase = p.role === "white" ? "white" : "out";
}
function ucWin(g) {
  const alive = g.players.filter(p => p.alive);
  const civ = alive.filter(p => p.role === "civil").length;
  if (alive.length - civ === 0) return "civils";
  if (civ <= 1) return "impostors";
  return null;
}
function ucContinue() {
  const g = L.game, w = ucWin(g);
  if (w) return ucEnd(w);
  g.round++; g.order = ucOrder(g); g.votes = {}; g.note = ""; g.whiteGuess = null; g.phase = "talk";
}
function ucEnd(w) {
  const g = L.game;
  g.winner = w; g.phase = "end";
  if (g.scored) return;
  g.players.forEach(p => {
    let pts = 0;
    if (w === "civils" && p.role === "civil") pts = POINTS.civil;
    if (w === "impostors" && p.alive && p.role !== "civil") pts = POINTS[p.role];
    if (w === "white" && p.role === "white") pts = POINTS.white;
    const n = pname(p.pid);
    L.scores[n] = (L.scores[n] || 0) + pts;
  });
  g.scored = true;
}
function ucGuess(pid, text) {
  const g = L.game;
  if (!g || g.kind !== "uc" || g.phase !== "white" || g.lastOut !== pid || g.whiteGuess) return;
  const t = cleanText(text);
  if (!t) return;
  g.whiteGuess = { text: t, ok: norm(t) === norm(g.civil) };
  if (g.whiteGuess.ok) return ucEnd("white");
  const voters = g.players.filter(p => p.role === "civil").map(p => p.pid);
  valStart("uc", voters, { guess: t, word: g.civil }, null, { guess: t });
}

/* ---------- Qui suis-je en ligne (hôte) ---------- */
function qsPool() {
  const sel = L.settings.cats.includes("all") ? DT_CATS : DT_CATS.filter(c => L.settings.cats.includes(c.id));
  const out = [];
  sel.forEach(c => dtItems(c).forEach(it => out.push({ w: it.w, c: c.name })));
  return out;
}
function qsDraw(g) {
  const pool = qsPool();
  const taken = g.players.filter(x => x.pick).map(x => x.pick.w);
  let fresh = pool.filter(x => !L.qsUsed.has(x.w) && !taken.includes(x.w));
  if (!fresh.length) { L.qsUsed.clear(); fresh = pool.filter(x => !taken.includes(x.w)); }
  if (!fresh.length) fresh = pool;
  const p = fresh[Math.floor(Math.random() * fresh.length)];
  L.qsUsed.add(p.w);
  return { w: p.w, c: p.c };
}
function qsStart() {
  const ps = L.players.filter(p => p.online);
  if (ps.length < 2) { L.note = "Il faut au moins 2 joueurs connectés."; return; }
  if (!qsPool().length) { L.note = "Choisis au moins une catégorie."; return; }
  const order = shuffle(ps);
  const g = { kind: "qs", phase: "pick", cur: 0, turn: 1, foundCount: 0, event: null, scored: false, players: [] };
  L.game = g;
  g.players = order.map((p, i) => ({ pid: p.pid, chooser: order[(i + 1) % order.length].pid, pick: null, rerolls: 0, validated: false, found: false, q: 0, rank: null }));
  g.players.forEach(x => x.pick = qsDraw(g));
}
const qsTarget = pid => L.game.players.find(x => x.chooser === pid);
function qsReroll(pid) {
  const g = L.game; if (!g || g.kind !== "qs" || g.phase !== "pick") return;
  const t = qsTarget(pid); if (!t || t.validated) return;
  t.pick = qsDraw(g); t.rerolls++;
}
function qsCustom(pid, text, img) {
  const g = L.game; if (!g || g.kind !== "qs" || g.phase !== "pick") return;
  const t = qsTarget(pid); const w = cleanText(text);
  if (!t || t.validated || !w) return;
  const ok = typeof img === "string" && img.length < 120000 && PHOTO_RE.test(img);
  t.pick = { w, c: "Choisi par " + pname(pid), img: ok ? img : null };
}
function qsValidate(pid) {
  const g = L.game; if (!g || g.kind !== "qs" || g.phase !== "pick") return;
  const t = qsTarget(pid); if (!t) return;
  t.validated = true;
  if (g.players.every(p => p.validated)) qsPlay();
}
function qsPlay() {
  const g = L.game;
  g.phase = "play"; g.cur = Math.floor(Math.random() * g.players.length); g.turn = 1; g.event = null; g.step = 1;
}
function qsNextIdx(g, from) {
  const n = g.players.length;
  for (let k = 1; k <= n; k++) { const j = (from + k) % n; if (!g.players[j].found) return j; }
  return -1;
}
function qsAdvance(g) {
  const nx = qsNextIdx(g, g.cur);
  if (nx <= g.cur) g.turn++;
  g.cur = nx;
  g.step = (g.step || 0) + 1;
}
function qsNext(pid, step) {
  const g = L.game; if (!g || g.kind !== "qs" || g.phase !== "play" || g.val) return;
  const c = g.players[g.cur]; if (!c || c.pid === pid || +step !== g.step) return;
  c.q++; g.event = null;
  qsAdvance(g);
}
function qsFound(pid, step) {
  const g = L.game; if (!g || g.kind !== "qs" || g.phase !== "play" || g.val) return;
  const c = g.players[g.cur]; if (!c || c.pid === pid || +step !== g.step) return;
  const voters = g.players.filter(p => p.pid !== c.pid).map(p => p.pid);
  valStart("qs", voters, { name: pname(c.pid), w: c.pick.w, step: g.step }, pid, { name: pname(c.pid) });
}
function qsValDone(ok, v) {
  const g = L.game, c = g.players[g.cur];
  if (!c || v.data.step !== g.step) return;
  c.q++;
  if (ok) {
    c.found = true; c.rank = ++g.foundCount;
    g.event = { name: pname(c.pid), w: c.pick.w, q: c.q };
    if (g.players.every(p => p.found)) return qsEnd();
  } else g.event = { refused: true, name: pname(c.pid) };
  qsAdvance(g);
}
function qsEnd() {
  const g = L.game;
  g.phase = "end";
  if (g.scored) return;
  const bonus = { 1: 3, 2: 2, 3: 1 };
  g.players.forEach(p => { const n = pname(p.pid); L.scores[n] = (L.scores[n] || 0) + (p.rank ? (bonus[p.rank] || 0) : 0); });
  g.scored = true;
}

/* ---------- Ce que chaque joueur a le droit de voir ---------- */
function settingsSummary() {
  const s = L.settings;
  if (s.game === "uc") {
    const th = s.themes.includes("all") ? "tous les thèmes" : allThemes().filter(t => s.themes.includes(t.id)).map(t => t.name).join(", ");
    return th + (s.white ? " · Mr. White activé" : "");
  }
  if (s.game === "qd") return s.qd.rounds + " questions · " + QD_PACKS.filter(p => s.qd.packs.includes(p.id)).map(p => p.name).join(", ");
  if (s.game === "dr") return DR_CATS().filter(c => s.dr.cats.includes(c.id)).map(c => c.name).join(", ") + " · " + s.dr.laps + " traits chacun";
  if (s.game === "lg") return lgCompText(lgCompCount(lgComposition(Math.max(L.players.length, 4), s.lg).roles));
  return s.cats.includes("all") ? "toutes les catégories" : DT_CATS.filter(c => s.cats.includes(c.id)).map(c => c.name).join(", ");
}
function viewFor(pid) {
  const v = {
    code: L.code, me: pid, isHost: pid === "host", note: L.note, scores: L.scores,
    players: L.players.map(p => ({ pid: p.pid, name: p.name, online: p.online, host: p.pid === "host" })),
    settings: { game: L.settings.game, themes: L.settings.themes, cats: L.settings.cats, white: L.settings.white, lg: L.settings.lg, qd: L.settings.qd, dr: L.settings.dr, summary: settingsSummary() },
    game: null
  };
  const g = L.game;
  if (!g) return v;
  if (g.kind === "uc") {
    const me = g.players.find(p => p.pid === pid);
    const gv = {
      kind: "uc", phase: g.phase, theme: g.theme, round: g.round, note: g.note,
      order: g.order.map(pname),
      list: g.players.map(p => ({ pid: p.pid, name: pname(p.pid), alive: p.alive, voted: !!g.votes[p.pid] })),
      inGame: !!me, alive: !!(me && me.alive), word: me ? me.word : null, white: !!(me && me.role === "white"),
      myVote: me && g.votes[pid] ? pname(g.votes[pid]) : null
    };
    if (g.lastOut && ["out", "white", "end"].includes(g.phase)) {
      const lo = g.players.find(p => p.pid === g.lastOut);
      gv.out = { pid: lo.pid, name: pname(lo.pid), role: lo.role };
      gv.lastVotes = Object.entries(g.lastVotes || {}).map(([a, b]) => [pname(a), pname(b)]);
    }
    if (g.whiteGuess) gv.whiteGuess = { text: g.whiteGuess.text, ok: g.whiteGuess.ok };
    if (g.phase === "end") gv.end = { winner: g.winner, civil: g.civil, ucw: g.ucw, roles: g.players.map(p => ({ name: pname(p.pid), role: p.role, alive: p.alive })) };
    v.game = gv;
  } else if (g.kind === "lg") {
    v.game = lgView(g, pid);
  } else if (g.kind === "qd") {
    v.game = qdView(g, pid);
  } else if (g.kind === "dr") {
    v.game = drView(g, pid);
  } else {
    const gv = { kind: "qs", phase: g.phase, turn: g.turn };
    if (g.phase === "pick") {
      const t = g.players.find(x => x.chooser === pid);
      gv.target = t ? { name: pname(t.pid), pick: t.pick, rerolls: t.rerolls, validated: t.validated } : null;
      gv.done = g.players.filter(x => x.validated).length;
      gv.total = g.players.length;
      gv.waiting = g.players.filter(x => !x.validated).map(x => pname(x.chooser));
    } else {
      gv.list = g.players.map((x, i) => ({
        name: pname(x.pid), me: x.pid === pid, found: x.found, q: x.q, rank: x.rank, cur: g.phase === "play" && i === g.cur,
        pick: (x.pid === pid && !x.found && g.phase !== "end") ? null : x.pick
      }));
      const c = g.players[g.cur];
      gv.curName = c ? pname(c.pid) : "";
      gv.meCur = !!(c && c.pid === pid);
      gv.inGame = g.players.some(x => x.pid === pid);
      gv.event = g.event;
      gv.step = g.step;
    }
    v.game = gv;
  }
  if (v.game && g.val) v.game.val = valView(g, pid);
  return v;
}


/* ---------- Validation collective (majorité + délai) ---------- */
const VAL_MS = 20000;
let valTimer = null;
function valStart(kind, voters, data, by, pub) {
  const g = L.game;
  g.val = { kind, voters, yes: {}, no: {}, ends: Date.now() + VAL_MS, data, pub: pub || {}, id: Date.now() + Math.random() };
  if (by && voters.includes(by)) g.val.yes[by] = true;
  const id = g.val.id;
  clearTimeout(valTimer);
  valTimer = setTimeout(() => { if (L && L.game && L.game.val && L.game.val.id === id) { valCheck(true); hostSync(); } }, VAL_MS + 300);
  valCheck(false);
}
function valCheck(timeout) {
  const g = L.game, v = g && g.val;
  if (!v) return;
  const n = v.voters.length, y = Object.keys(v.yes).length, no = Object.keys(v.no).length;
  const need = Math.floor(n / 2) + 1;
  if (y >= need) return valDone(true);
  if (no > n - need) return valDone(false);
  if (timeout) return valDone(y > no);
}
function valDone(ok) {
  const g = L.game, v = g.val;
  g.val = null;
  clearTimeout(valTimer);
  if (v.kind === "qs") qsValDone(ok, v);
  else if (v.kind === "dr") drEnd(ok ? "imp" : "crew");
  else if (v.kind === "uc") { g.whiteGuess.ok = ok; g.whiteGuess.byVote = true; if (ok) ucEnd("white"); }
}
function valVote(pid, x) {
  const g = L.game, v = g && g.val;
  if (!v || !v.voters.includes(pid)) return;
  delete v.yes[pid]; delete v.no[pid];
  (x === "yes" ? v.yes : v.no)[pid] = true;
  valCheck(false);
}
function valView(g, pid) {
  const v = g.val, can = v.voters.includes(pid);
  return { kind: v.kind, data: can ? v.data : v.pub, yes: Object.keys(v.yes).length, no: Object.keys(v.no).length, total: v.voters.length, canVote: can, mine: v.yes[pid] ? "yes" : v.no[pid] ? "no" : null, left: Math.max(0, v.ends - Date.now()) };
}
function valBlock(val, title, detail) {
  return `<div class="val-box">
    <span class="eyebrow">Vote du groupe · <span data-deadline="${O.viewAt + val.left}">${fmtClock(val.left)}</span></span>
    <b>${title}</b>${detail ? `<p>${detail}</p>` : ""}
    <div class="val-count"><span class="ok">✓ ${val.yes}</span><span class="ko">✗ ${val.no}</span><span>${val.total} votant${val.total > 1 ? "s" : ""}</span></div>
    ${val.canVote ? `<div class="row"><button class="btn" data-act="o-send" data-a="val-vote" data-x="yes" aria-pressed="${val.mine === "yes"}">Oui, ça compte</button><button class="btn-ghost" data-act="o-send" data-a="val-vote" data-x="no" aria-pressed="${val.mine === "no"}">Non</button></div>` : `<p class="hint">Les autres joueurs vérifient…</p>`}
    <p class="hint">Il faut la majorité. À la fin du temps, les votes déjà donnés décident.</p>
  </div>`;
}

/* ---------- Joueur ---------- */
function oJoin() {
  const name = oName(); if (!name) return;
  const code = (O.code || "").toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)) { O.msg = "Le code fait 4 lettres."; return render(); }
  if (withFb(oJoin)) return;
  oDestroy();
  O.busy = true; O.msg = "Connexion au lobby " + code + "…"; O.screen = "entry"; render();
  oKeepAwake();
  (async () => {
    const r = roomRef(code);
    const h = await r.child("host").once("value");
    if (!h.exists()) return oFail("Lobby introuvable. Vérifie le code.");
    if (h.val() === fb.uid) { O.resumeCode = code; return oResume(); }
    NET.room = r; NET.code = code; NET.join = newJoinId(); O.code = code; roomSet("lastRoom", code);
    const me = r.child("players/" + fb.uid);
    const conn = fb.db.ref(".info/connected");
    const onConn = conn.on("value", s => {
      const was = O.offline;
      if (s.val() === true) NET.everConn = true;
      O.offline = NET.everConn && s.val() !== true;
      if (s.val() === true) {
        me.onDisconnect().update({ online: false });
        me.update({ name, online: true, join: NET.join, ts: SERVER_TS() }).catch(e => oFail(fbError(e)));
      }
      if (was !== O.offline && O.screen === "room") render();
    });
    const vref = r.child("views/" + fb.uid);
    const myJoin = NET.join;
    const onV = s => {
      if (NET.join !== myJoin) return;
      const raw = s.val();
      if (raw === null) { if (NET.gotView) oFail("L'hôte a fermé le lobby."); return; }
      let m;
      try { m = JSON.parse(raw); } catch (e) { return; }
      if (m.j !== myJoin) return;
      if (m.t === "view") { NET.gotView = true; clearTimeout(NET.joinTimer); }
      clientOnData(m);
    };
    vref.on("value", onV, e => oFail(fbError(e)));
    const hs = r.child("hostSeen");
    const onH = s => { const away = s.val() === 0; if (away !== O.hostAway) { O.hostAway = away; if (O.screen === "room") render(); } };
    hs.on("value", onH);
    NET.off.push(() => { conn.off("value", onConn); vref.off("value", onV); hs.off("value", onH); me.onDisconnect().cancel(); });
    NET.joinTimer = setTimeout(() => { if (!NET.gotView) oFail("L'hôte ne répond pas. Il a peut-être fermé la page."); }, 15000);
  })().catch(e => oFail(fbError(e)));
}
function clientOnData(msg) {
  if (!msg || typeof msg !== "object") return;
  if (msg.t === "view") { O.view = msg.v; O.viewAt = Date.now(); O.screen = "room"; O.busy = false; O.msg = ""; render(); }
  else if (msg.t === "reject") oFail(String(msg.msg || "Connexion refusée."));
  else if (msg.t === "kicked") oFail("L'hôte t'a retiré du lobby.");
  else if (msg.t === "closed") oFail("L'hôte a fermé le lobby.");
}
function oSend(a) {
  if (O.isHost) return hostAct("host", a);
  if (!NET.room || !fb) return;
  const m = { a: String(a.a || ""), ts: SERVER_TS() };
  if (a.x !== undefined && a.x !== null) m.x = a.x;
  if (typeof a.img === "string") m.img = a.img;
  if (typeof a.data === "string") m.data = a.data;
  NET.room.child("actions/" + fb.uid).push(m).catch(e => { O.msg = fbError(e); render(); });
}
function oLeave() {
  if (O.isHost && NET.room && L) {
    const r = NET.room;
    L.players.forEach(p => { if (p.pid !== "host") r.child("views/" + p.pid).set(JSON.stringify({ t: "closed", j: p.join || "" })).catch(() => {}); });
    setTimeout(() => r.remove().catch(() => {}), 1500);
    O.resumeCode = ""; roomSet("hostRoom", "");
  } else if (NET.room && fb) {
    NET.room.child("players/" + fb.uid).remove().catch(() => {});
  }
  oDestroy();
  O.screen = "entry"; O.msg = ""; O.busy = false; O.confirmLeave = false; O.confirmStop = false;
}
function shareLink(code) {
  const u = new URL(location.href);
  u.search = ""; u.hash = "";
  u.searchParams.set("lobby", code);
  return u.toString();
}
function oCopy() {
  const link = shareLink(O.view.code);
  const fallback = () => { const el = document.getElementById("o-link"); if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } };
  try {
    navigator.clipboard.writeText(link).then(() => { O.copied = true; render(); setTimeout(() => { O.copied = false; render(); }, 1800); }, fallback);
  } catch (e) { fallback(); }
}

  hunter: ["Quand tu meurs, la nuit ou au vote, tu choisis tout de suite un joueur qui meurt avec toi.", "Si tu meurs, vise le joueur le plus suspect. Les loups évitent souvent de tuer un chasseur connu.", "Ton camp gagne quand tous les loups sont morts."],
  cupid: ["La première nuit, tu choisis deux amoureux, toi compris si tu veux. Ils savent qui est leur amoureux. Si l'un meurt, l'autre meurt aussi.", "Si un loup et un villageois sont amoureux, ils forment un camp à part et gagnent s'ils sont les deux derniers.", "Ton camp gagne quand tous les loups sont morts."],
  girl: ["La nuit, tu peux espionner : tu découvres le nom d'un loup. Mais tu as 1 chance sur 4 d'être repérée, et les loups l'apprennent.", "Si tu as vu un loup, fais-le éliminer au vote sans trop dire comment tu le sais.", "Ton camp gagne quand tous les loups sont morts."],
  guard: ["Chaque nuit, tu protèges un joueur, toi compris : s'il est attaqué par les loups, il survit. Jamais le même joueur deux nuits de suite.", "Protège la Voyante si tu la devines.", "Ton camp gagne quand tous les loups sont morts."],
  idiot: ["Si le village vote contre toi, tu ne meurs pas : ton rôle est révélé, mais tu ne votes plus.", "Tu peux jouer un peu louche pour attirer les votes : ça fait perdre un tour aux loups.", "Ton camp gagne quand tous les loups sont morts."],
  elder: ["Tu survis à la première attaque des loups. Mais si c'est le village qui te tue (vote, sorcière, chasseur), tous les villageois perdent leurs pouvoirs.", "Fais comprendre au bon moment qu'il ne faut pas voter contre toi.", "Ton camp gagne quand tous les loups sont morts."],
  raven: ["Chaque nuit, tu désignes un joueur : au vote suivant, il a 2 voix de plus contre lui. Tout le monde voit qui tu as désigné.", "Utilise-le sur un suspect pour faire pencher un vote serré.", "Ton camp gagne quand tous les loups sont morts."]
};
const LG_RULES = `<details class="box"><summary>Règles du Loup-Garou</summary><ul class="lg-rules">
  <li><b>La nuit</b>, chaque rôle agit en secret sur son téléphone. Les loups choisissent une victime. Ceux qui n'ont rien à faire attendent.</li>
  <li><b>Le jour</b>, les morts sont révélés avec leur rôle. Vous débattez à voix haute, puis chacun vote sur son téléphone pour éliminer un suspect. En cas d'égalité, personne n'est éliminé.</li>
  <li><b>Le village</b> gagne quand tous les loups sont morts. <b>Les loups</b> gagnent quand il ne reste plus qu'eux.</li>
  <li><b>Les morts</b> voient tous les rôles, mais ne parlent plus et ne votent plus.</li>
</ul></details>`;
function lgHelpBlock(role, open) {

    <p><b>Ce que tu fais.</b> ${h[0]}</p><p><b>Conseil.</b> ${h[1]}</p><p><b>Pour gagner.</b> ${h[2]}</p></details>`;

const LG_SPECIALS = ["seer", "witch", "hunter", "cupid", "guard", "girl", "idiot", "elder", "raven", "white"];
const LG_ORDER = ["wolf", "white", "seer", "witch", "hunter", "cupid", "guard", "girl", "idiot", "elder", "raven", "villager"];
const LG_VILLAGE = "Brumeval";
const isWolfRole = r => r === "wolf" || r === "white";
const lgDefaultWolves = n => n <= 6 ? 1 : n <= 11 ? 2 : 3;

function lgComposition(n, st) {

  for (const r of LG_SPECIALS) {
    if (!st.roles.includes(r)) continue;

function lgSay(g, kind, text) { g.seq++; g.say = { id: g.seq, kind, text }; }

const lgAlive = g => g.players.filter(p => p.alive);

function lgStart() {

function lgTask(g, p) {
  if (!p || !p.alive) return null;

  if (isWolfRole(r)) return { type: "wolf", white: r === "white" && g.nightNo % 2 === 0 };
  if (!lgActive(g, p)) return { type: "dummy" };
  if (r === "cupid" && g.nightNo === 1) return { type: "cupid" };
  if (r === "seer") return { type: "seer" };
  if (r === "guard") return { type: "guard" };
  if (r === "girl") return { type: "girl" };
  if (r === "raven") return { type: "raven" };
  return { type: "dummy" };

function lgNight() {
  const g = L.game;

  g.n = { acts: {}, wolfPicks: {}, seer: {}, spy: null, caught: null, susp: {}, guard: null, wolfTarget: null, whiteDone: false, whiteKill: null, witchSave: false, witchKill: null, raven: null };

  lgAlive(g).forEach(p => { const t = lgTask(g, p); if (t && t.type === "dummy") g.n.acts[p.pid] = true; });

    ? `La nuit tombe sur ${LG_VILLAGE}. Tout le village s'endort. Les créatures de la nuit ouvrent les yeux.`
    : `La nuit retombe sur ${LG_VILLAGE}. Le village s'endort, et les loups sortent de l'ombre.`);
}

function lgNightAct(pid, a, x) {

  if (!p || !p.alive) return;

  const t = lgTask(g, p);
  if (!t) return;
  const target = lgP(g, x), okT = !!(target && target.alive);
  switch (a) {
    case "lg-wolfpick": if (t.type === "wolf" && okT && !isWolfRole(target.role)) N.wolfPicks[pid] = x; break;
    case "lg-wolfok": if (t.type === "wolf" && N.wolfPicks[pid] && (!t.white || N.whiteDone)) N.acts[pid] = true; break;
    case "lg-white":
      if (t.type === "wolf" && t.white) {
        if (x === "none") { N.whiteDone = true; N.whiteKill = null; }
        else if (okT && isWolfRole(target.role) && x !== pid) { N.whiteDone = true; N.whiteKill = x; }
      }

    case "lg-cupid": {

    const c = {};
    picks.forEach(t => c[t] = (c[t] || 0) + 1);
    const max = Math.max(...Object.values(c));
    const top = Object.keys(c).filter(k => c[k] === max);
    N.wolfTarget = top[Math.floor(Math.random() * top.length)];
  } else N.wolfTarget = null;

function lgWitch(x) {
  const g = L.game, N = g.n;
  const [s, k] = String(x || "").split("|");

  if (k && k !== "none" && g.potions.death) { const t = lgP(g, k); if (t && t.alive) { N.witchKill = k; g.potions.death = false; } }

function lgKill(g, pid, cause, list) {
  const p = lgP(g, pid);
  if (!p || !p.alive) return;
  p.alive = false;
  list.push({ pid, cause });
  g.log.push(`${g.phase === "night" ? "Nuit " + g.nightNo : "Jour " + g.dayNo} : ${pname(pid)} ${lgCause(cause)} (${LG_ROLES[p.role].name}).`);

    g.powersLost = true;
    g.log.push("L'Ancien a été tué par le village : les villageois perdent leurs pouvoirs.");
  }

}

}

function lgShoot(pid, x, forced) {
  const g = L.game;
  if (!g || g.kind !== "lg" || g.phase !== "hunter" || (!forced && pid !== g.hunter)) return;
  const t = lgP(g, x);
  const list = [];
  if (t && t.alive && x !== g.hunter) lgKill(g, x, "hunter", list);
  if (g.after === "day") g.dawn.deaths.push(...list);
  else g.verdict.deaths.push(...list);

  if (g.after === "day") return lgToDay();

function lgToVote() {
  const g = L.game;
  g.phase = "vote"; g.votes = {};

}
const lgVoters = g => lgAlive(g).filter(p => !p.idiotOut);
function lgVote(pid, x) {
  const g = L.game;
  if (!g || g.kind !== "lg" || g.phase !== "vote") return;
  const p = lgP(g, pid), t = lgP(g, x);
  if (!p || !p.alive || p.idiotOut || !t || !t.alive || x === pid) return;

function lgWin(g) {
  const alive = lgAlive(g);
  if (!alive.length) return "none";
  if (g.lovers && alive.length === 2 && alive.every(p => g.lovers.includes(p.pid))) {
    const [a, b] = g.lovers.map(id => isWolfRole(lgP(g, id).role));
    if (a !== b) return "lovers";
  }
  if (alive.length === 1 && alive[0].role === "white") return "white";
  const wolves = alive.filter(p => isWolfRole(p.role)).length;
  if (!wolves) return "village";
  if (wolves === alive.length) {
    if (alive.some(p => p.role === "white") && alive.length > 1) return null;
    return "wolves";
  }
  return null;
}

function lgWinners(g) {
  const w = g.winner;
  return g.players.filter(p =>
    w === "village" ? !isWolfRole(p.role) :
    w === "wolves" ? p.role === "wolf" :
    w === "white" ? p.role === "white" :
    w === "lovers" ? (g.lovers || []).includes(p.pid) : false).map(p => p.pid);
}

function lgEnd(w) {
  const g = L.game;
  g.phase = "end"; g.winner = w; g.stage = null;
  if (!g.scored) {
    lgWinners(g).forEach(pid => { const n = pname(pid); L.scores[n] = (L.scores[n] || 0) + 2; });
    g.scored = true;
  }
  lgSay(g, "end", {
    village: `Les loups ont tous été démasqués. Le village de ${LG_VILLAGE} a gagné !`,
    wolves: `Il ne reste plus que des loups. Les loups-garous ont dévoré ${LG_VILLAGE} !`,
    white: "Le Loup Blanc est le dernier survivant. Il gagne seul !",
    lovers: "Les amoureux sont les derniers survivants. L'amour a gagné !",
    none: "Il ne reste personne à " + LG_VILLAGE + "."
  }[w]);
}

function lgForce() {
  const g = L.game;
  if (g.phase === "reveal") return lgNight();
  if (g.phase === "night") return g.stage === "A" ? lgEndStageA() : lgDawn();
  if (g.phase === "vote") return lgResolveVote();
  if (g.phase === "hunter") return lgShoot(null, "none", true);
}

function lgSet(x) {
  const st = L.settings.lg;
  const [k, val] = String(x || "").split(":");
  if (k === "role" && LG_SPECIALS.includes(val)) st.roles = st.roles.includes(val) ? st.roles.filter(r => r !== val) : st.roles.concat(val);
  if (k === "wolves") {
    const n = L.players.length;
    if (val === "auto") st.wolves = 0;
    else st.wolves = Math.max(1, Math.min(4, (st.wolves || lgDefaultWolves(n)) + (val === "+" ? 1 : -1)));
  }
  if (k === "debate") st.debate = Math.max(0, Math.min(600, +val || 0));
}

function lgView(g, pid) {
  const me = lgP(g, pid);
  const end = g.phase === "end";
  const seeAll = end || !!(me && !me.alive);
  const meWolf = !!(me && isWolfRole(me.role));
  const myLover = g.lovers && me && g.lovers.includes(pid) ? g.lovers.find(x => x !== pid) : null;
  const players = g.players.map(p => {
    let role = null;
    if (p.pid === pid || seeAll || !p.alive || p.idiotOut) role = p.role;
    else if (meWolf && isWolfRole(p.role)) role = "wolf";
    return { pid: p.pid, name: pname(p.pid), alive: p.alive, role, me: p.pid === pid, idiotOut: p.idiotOut,
      lover: (seeAll && !!g.lovers && g.lovers.includes(p.pid)) || p.pid === myLover };
  });
  const v = {
    kind: "lg", phase: g.phase, stage: g.stage, nightNo: g.nightNo, dayNo: g.dayNo, comp: g.comp, say: g.say, players,
    me: me ? { role: me.role, alive: me.alive, idiotOut: me.idiotOut } : null,
    loverName: myLover ? pname(myLover) : null,
    pack: meWolf ? g.players.filter(p => isWolfRole(p.role) && p.pid !== pid).map(p => pname(p.pid)) : null,
    powersLost: g.powersLost, log: end ? g.log : []
  };
  if (g.phase === "reveal") { v.ready = !!g.ready[pid]; v.readyCount = Object.keys(g.ready).length; v.total = g.players.length; }
  if (g.phase === "night") {
    const N = g.n;
    v.done = !!(me && N.acts[pid]);
    v.waiting = lgAlive(g).filter(p => !N.acts[p.pid]).length;
    if (g.stage === "A" && me && me.alive) {
      const t = lgTask(g, me);
      v.task = t;
      if (t.type === "wolf") {

function lgSfx(kind) {

    if (kind === "dayDeath") tone(98, 2.2, "triangle", 0.2, null, 1);

  ${O.lgPeek && g.me ? `<div class="lg-peek">${lgCard(g.me.role)}${lgHelpBlock(g.me.role, false)}${g.pack && g.pack.length ? `<p class="hint">Ta meute : ${esc(listNames(g.pack))}</p>` : ""}${g.loverName ? `<p class="hint">Tu es amoureux de ${esc(g.loverName)}.</p>` : ""}</div>` : ""}`;
}
function lgCompBlock(g) {
  return `<details class="box"><summary>Rôles en jeu</summary><div class="lg-comp">${g.comp.map(([r, k]) => `<span class="lg-chip" style="--rc:${LG_ROLES[r].bg}">${LG_ART[r]}<span>${k > 1 ? k + " × " : ""}${LG_ROLES[r].name}</span></span>`).join("")}</div></details>`;
}
function lgPlayersBlock(g, title) {
  return `<section class="section"><span class="label">${title || "Joueurs"}</span><div class="lg-plist">${g.players.map(p => `
    <div class="lg-prow ${p.alive ? "" : "dead"}">
      <span class="lg-pname">${esc(p.name)}${p.me ? " · toi" : ""}${p.lover ? ' <span class="lg-heart" title="Amoureux">♥</span>' : ""}${p.idiotOut ? " · sans vote" : ""}</span>
      <span class="lg-pstate">${p.role ? lgMini(p.role) : ""}${p.alive ? "" : '<span class="lg-rip">mort</span>'}</span>
    </div>`).join("")}</div></section>`;
}
function lgPickList(g, opts) {
  const o = opts || {};
  const list = g.players.filter(p => p.alive && (o.self || !p.me) && (!o.filter || o.filter(p)));
  return `<div class="vote">${list.map(p => {
    const sel = o.selected ? o.selected(p) : O.sel === p.pid;
    const dis = o.disabled && o.disabled(p);
    return `<button data-act="${o.act || "o-lgsel"}" data-x="${p.pid}"${o.a ? ` data-a="${o.a}"` : ""} aria-pressed="${!!sel}" ${dis ? "disabled" : ""}><span>${esc(p.name)}${p.me ? " · toi" : ""}</span><span class="agent" style="color:inherit">${o.extra ? o.extra(p) : ""}</span></button>`;
  }).join("")}</div>`;
}
const lgWait = (g, txt) => `<p class="hint">${txt || "En attente des autres joueurs"}${g.waiting ? ` · encore ${g.waiting}` : ""}…</p>`;
const lgForceBtn = (v, label) => v.isHost ? `<button class="btn-ghost lg-force" data-act="o-send" data-a="lg-force">${label || "Passer les joueurs absents"}</button>` : "";
const lgDeadNote = `<div class="banner warn">Tu es mort. Tu vois tous les rôles, mais chut : ne révèle rien aux vivants !</div>`;

function vOLg(v) {
  const g = v.game;
  const body = { reveal: lgVReveal, night: lgVNight, day: lgVDay, vote: lgVVote, verdict: lgVVerdict, hunter: lgVHunter, end: lgVEnd }[g.phase];
  return `<div class="lg">${lgScene(lgSceneKind(g))}${g.phase !== "reveal" && g.phase !== "end" ? lgTopBar(v, g) : ""}${body(v, g)}</div>`;
}

function lgVReveal(v, g) {
  return `<header class="section"><span class="eyebrow">${LG_VILLAGE} · distribution des rôles</span><h2>Ton rôle</h2>
    <p class="lead">Regarde ton rôle en cachant ton écran. Ne le montre à personne.</p></header>
    <div class="flip ${O.lgFlip ? "on" : ""}" data-act="o-lgflip" role="button" tabindex="0" aria-label="Retourner la carte">
      <div class="flip-in">
        <div class="flip-front">${LG_CARDBACK}<b>Touche pour découvrir ton rôle</b></div>
        <div class="flip-back">${lgCard(g.me.role)}</div>
      </div>
    </div>
    ${O.lgFlip && g.pack && g.pack.length ? `<div class="banner warn">Ta meute : ${esc(listNames(g.pack))}</div>` : ""}
    ${O.lgFlip ? lgHelpBlock(g.me.role, true) : ""}
    ${g.ready ? `<p class="hint">Prêt. En attente des autres : ${g.readyCount}/${g.total}.</p>` : `<button class="btn" data-act="o-send" data-a="lg-ready">J'ai retenu mon rôle</button>`}
    ${lgCompBlock(g)}
    ${LG_RULES}
    ${lgForceBtn(v, "Commencer sans attendre")}`;
}

function lgVNight(v, g) {
  const head = `<header class="section"><span class="eyebrow">Nuit ${g.nightNo}</span>`;
  if (!g.me || !g.me.alive) return `${head}<h2>La nuit est tombée</h2></header>${lgDeadNote}${lgPlayersBlock(g)}${lgForceBtn(v)}`;
  if (g.stage === "B") {
    if (g.task && g.task.type === "witch") return head + lgVWitch(v, g);
    return `${head}<h2>La sorcière se réveille…</h2><p class="lead">Elle découvre la victime des loups et choisit d'utiliser ou non ses potions.</p></header>
      <div class="lg-sleep">${LG_ART.witch}</div>${lgForceBtn(v, "Passer (sorcière absente)")}`;
  }
  const t = g.task;
  if (t && t.type === "dummy") {
    return `${head}<h2>Le village dort</h2><p class="lead">Tu n'as rien à faire cette nuit. Garde ton téléphone devant toi comme les autres, pour ne rien laisser deviner.</p></header>
      <div class="lg-sleep">${LG_ART.villager}</div>${lgWait(g, "Les rôles de la nuit agissent")}${lgForceBtn(v)}`;
  }
  if (g.done) {
    let res = "";
    if (t.type === "seer" && g.seerRes) res = `<p class="lead">Ta vision révèle le rôle de <b>${esc(g.seerRes.name)}</b> :</p>${lgCard(g.seerRes.role, { desc: false, small: true })}`;
    if (t.type === "girl" && g.spyRes) res = g.spyRes.none ? `<p class="lead">Tu as dormi sagement.</p>`
      : `<p class="lead">Tu as aperçu un loup : <b>${esc(g.spyRes.name || "personne")}</b>.</p>${g.spyRes.caught ? `<div class="banner warn">Les loups t'ont vue ! Ils savent que tu es la Petite Fille.</div>` : ""}`;
    if (t.type === "cupid" && g.cupidDone) res = `<p class="lead">${esc(g.cupidDone[0])} et ${esc(g.cupidDone[1])} sont désormais amoureux.</p>`;
    if (t.type === "wolf") res = `<p class="lead">La meute a fait son choix.</p>`;
    return `${head}<h2>Tu te rendors…</h2></header>${res}${lgWait(g)}${lgForceBtn(v)}`;
  }
  let ui = "";
  if (t.type === "wolf") {
    const counts = {};
    g.wolfPicks.forEach(w => counts[w.target] = (counts[w.target] || []).concat(w.by));
    ui = `<h2>Les loups chassent</h2><p class="lead">Choisissez ensemble votre victime. ${g.pack.length ? "Ta meute : " + esc(listNames(g.pack)) + "." : "Tu chasses seul."}</p></header>
      ${g.caught ? `<div class="banner warn">Vous avez surpris ${esc(g.caught)} en train d'espionner : c'est la Petite Fille !</div>` : ""}
      ${lgPickList(g, { act: "o-send", a: "lg-wolfpick", filter: p => !(p.role === "wolf" || p.role === "white"), selected: p => g.myWolfPick === p.pid, extra: p => counts[p.pid] ? counts[p.pid].length + " loup" + (counts[p.pid].length > 1 ? "s" : "") : "" })}`;
    if (t.white) {
      ui += `<section class="confirm"><span class="label">Loup Blanc : cette nuit, tu peux aussi dévorer un loup</span>
        ${g.whiteDone ? `<p class="hint">Choix fait : ${g.whiteKill ? esc(g.whiteKill) : "personne"}.</p>` : `${lgPickList(g, { act: "o-send", a: "lg-white", filter: p => p.role === "wolf" && !p.me })}<button class="btn-ghost" data-act="o-send" data-a="lg-white" data-x="none">Personne cette nuit</button>`}</section>`;
    }
    ui += `<button class="btn btn-danger" data-act="o-send" data-a="lg-wolfok" ${g.myWolfPick && (!t.white || g.whiteDone) ? "" : "disabled"}>Confirmer la victime</button>`;
  } else if (t.type === "seer") {
    ui = `<h2>Voyante, ouvre les yeux</h2><p class="lead">Choisis le joueur dont tu veux connaître le rôle.</p></header>${lgPickList(g)}${lgConfirm("lg-seer", "Sonder ce joueur")}`;
  } else if (t.type === "guard") {
    ui = `<h2>Salvateur, qui protèges-tu ?</h2><p class="lead">Ce joueur sera à l'abri des loups cette nuit. Tu peux te protéger toi-même.</p></header>
      ${lgPickList(g, { self: true, disabled: p => p.pid === g.lastGuard, extra: p => p.pid === g.lastGuard ? "protégé hier" : "" })}${lgConfirm("lg-guard", "Protéger ce joueur")}`;
  } else if (t.type === "cupid") {
    ui = `<h2>Cupidon, tire tes flèches</h2><p class="lead">Choisis deux joueurs qui tomberont amoureux. Tu peux te choisir.</p></header>
      ${lgPickList(g, { self: true, act: "o-lgpair", selected: p => O.sel2.includes(p.pid) })}
      <button class="btn" data-act="o-lgsend" data-a="lg-cupid" data-k="pair" ${O.sel2.length === 2 ? "" : "disabled"}>Unir ces deux joueurs</button>`;
  } else if (t.type === "girl") {
    ui = `<h2>Petite Fille, tu entends du bruit…</h2><p class="lead">Espionner te révèle un loup, mais tu as une chance sur quatre de te faire repérer.</p></header>
      <div class="row"><button class="btn btn-danger" data-act="o-send" data-a="lg-girl" data-x="spy">Espionner</button><button class="btn-ghost" data-act="o-send" data-a="lg-girl" data-x="sleep">Dormir sagement</button></div>`;
  } else if (t.type === "raven") {
    ui = `<h2>Corbeau, qui maudis-tu ?</h2><p class="lead">Ce joueur aura 2 voix de plus contre lui au prochain vote.</p></header>
      ${lgPickList(g)}${lgConfirm("lg-raven", "Maudire ce joueur")}<button class="btn-ghost" data-act="o-send" data-a="lg-raven" data-x="none">Personne cette nuit</button>`;
  }
  return head + ui + lgForceBtn(v);
}
function lgConfirm(a, label) {
  return `<button class="btn" data-act="o-lgsend" data-a="${a}" data-k="sel" ${O.sel ? "" : "disabled"}>${label}</button>`;
}
function lgVWitch(v, g) {
  const p = g.potions;
  return `<h2>Sorcière, à toi</h2>
    <p class="lead">${g.victim ? `Les loups ont attaqué <b>${esc(g.victim)}</b>.` : "Les loups n'ont attaqué personne cette nuit."}</p></header>
    <div class="lg-sleep">${LG_ART.witch}</div>
    ${p.life && g.victim ? `<button class="chip lg-potion" data-act="o-lgwsave" aria-pressed="${O.wSave}">Potion de vie : sauver ${esc(g.victim)}</button>` : `<p class="hint">${p.life ? "" : "Potion de vie déjà utilisée."}</p>`}
    ${p.death ? `<section class="section"><span class="label">Potion de mort</span>${lgPickList(g, { self: false, act: "o-lgwkill", selected: q => O.wKill === q.pid })}
      <button class="btn-ghost" data-act="o-lgwkill" data-x="none" aria-pressed="${!O.wKill}">Ne tuer personne</button></section>` : `<p class="hint">Potion de mort déjà utilisée.</p>`}
    <button class="btn" data-act="o-lgsend" data-a="lg-witch" data-k="witch">Terminer ma nuit</button>`;
}

function lgDeathsBlock(list, emptyText) {
  if (!list || !list.length) return `<div class="banner">${emptyText}</div>`;
  return `<div class="lg-deaths">${list.map(d => `<div class="lg-death">${lgCard(d.role, { desc: false, small: true })}<p><b>${esc(d.name)}</b> ${lgCause(d.cause)}.</p></div>`).join("")}</div>`;
}
function lgVDay(v, g) {
  const timer = g.dayLeft !== null && g.dayLeft !== undefined ? `<div class="lg-timer" data-deadline="${O.viewAt + g.dayLeft}">${fmtClock(g.dayLeft)}</div>` : "";
  return `<header class="section"><span class="eyebrow">Jour ${g.dayNo}</span><h2>Le jour se lève</h2></header>
    ${lgDeathsBlock(g.dawn && g.dawn.deaths, "Miracle : personne n'est mort cette nuit.")}
    ${g.raven ? `<div class="banner warn">Le corbeau a désigné ${esc(g.raven)} : 2 voix de plus contre lui au vote.</div>` : ""}
    ${!g.me || !g.me.alive ? lgDeadNote : `<p class="lead">Débattez à voix haute : qui est le loup ?</p>`}
    ${timer}
    ${v.isHost ? `<button class="btn" data-act="o-send" data-a="lg-tovote">Passer au vote</button>` : `<p class="hint">L'hôte lance le vote quand le débat est fini.</p>`}
    ${lgPlayersBlock(g)}${lgCompBlock(g)}`;
}
function lgVVote(v, g) {
  let mine;
  if (!g.canVote) mine = `<p class="hint">${g.me && g.me.alive ? "L'Idiot du village ne vote plus." : "Les morts ne votent pas."}</p>`;
  else if (g.myVote) mine = `<div class="banner">Tu as voté contre ${esc(g.myVote)}.</div>`;
  else mine = `${lgPickList(g)}<button class="btn btn-danger" data-act="o-lgsend" data-a="lg-vote" data-k="sel" ${O.sel ? "" : "disabled"}>Voter contre ce joueur</button>`;
  return `<header class="section"><span class="eyebrow">Jour ${g.dayNo} · vote</span><h2>Qui est le loup ?</h2>
    <p class="lead">Votes : ${g.voted}/${g.eligible}.${g.raven ? ` ${esc(g.raven)} a déjà 2 voix du corbeau.` : ""}</p></header>
    ${mine}
    ${g.tally.length ? `<section class="section"><span class="label">Décompte en direct</span><div class="lg-tally">${g.tally.map(([n, c]) => `<div class="lg-trow"><span>${esc(n)}</span><i style="--w:${Math.min(100, c * 20)}%"></i><b>${c}</b></div>`).join("")}</div></section>` : ""}
    ${g.votes.length ? `<details class="box"><summary>Qui a voté pour qui</summary><div class="scores">${g.votes.map(([a, b]) => `<div class="score-row"><span>${esc(a)}</span><b>→ ${esc(b)}</b></div>`).join("")}</div></details>` : ""}
    ${v.isHost && g.voted < g.eligible ? `<button class="btn-ghost" data-act="o-send" data-a="lg-force">Dépouiller sans attendre</button>` : ""}`;
}
function lgVVerdict(v, g) {
  const vd = g.verdict;
  let main;
  if (vd.tie) main = `<h2>Égalité</h2><p class="lead">Le village n'arrive pas à se décider. Personne n'est éliminé.</p></header>`;
  else if (vd.idiot) main = `<h2>${esc(vd.name)} est l'Idiot du village !</h2><p class="lead">Le village l'épargne en riant, mais il ne votera plus.</p></header>${lgCard("idiot", { desc: false, small: true })}`;
  else main = `<h2>${esc(vd.name)} est éliminé</h2></header>${lgDeathsBlock(vd.deaths)}`;
  return `<header class="section"><span class="eyebrow">Jour ${g.dayNo} · verdict</span>${main}
    ${vd.votes.length ? `<details class="box"><summary>Les votes</summary><div class="scores">${vd.votes.map(([a, b]) => `<div class="score-row"><span>${esc(a)}</span><b>→ ${esc(b)}</b></div>`).join("")}${vd.raven ? `<div class="score-row"><span>Corbeau</span><b>+2 → ${esc(vd.raven)}</b></div>` : ""}</div></details>` : ""}
    ${v.isHost ? `<button class="btn" data-act="o-send" data-a="lg-continue">${vd.pendingHunter ? "Continuer" : "La nuit tombe"}</button>` : `<p class="hint">En attente de l'hôte.</p>`}`;
}

}
function lgVEnd(v, g) {
  const title = { village: "Le village a gagné", wolves: "Les loups ont gagné", white: "Le Loup Blanc gagne seul", lovers: "Les amoureux ont gagné", none: "Personne n'a survécu" }[g.winner];

    ${g.log.length ? `<details class="box"><summary>Journal de la partie</summary><ol class="lg-log">${g.log.map(l => `<li>${esc(l)}</li>`).join("")}</ol></details>` : ""}
    ${scoreBlock(v)}

}
function fmtClock(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
setInterval(() => {
  document.querySelectorAll("[data-deadline]").forEach(el => {
    const left = +el.dataset.deadline - Date.now();
    el.textContent = left > 0 ? fmtClock(left) : "Temps écoulé";
    el.classList.toggle("hot", left <= 10000);
  });
}, 500);

    <section class="section"><span class="label">Débat du jour</span><div class="chips">${debates.map(([s, l]) => `<button class="chip" data-act="o-send" data-a="lg-set" data-x="debate:${s}" aria-pressed="${st.debate === s}">${l}</button>`).join("")}</div></section>

      ${c.dropped.length ? `<p class="hint">Pas assez de joueurs pour : ${esc(c.dropped.map(r => LG_ROLES[r].name).join(", "))}.</p>` : ""}
      ${n < 6 ? `<p class="hint">Minimum 4 joueurs, idéal à partir de 6.</p>` : ""}</div>`;

let drCur = null;
function drPaint(cv, strokes, extra) {
  const r = cv.getBoundingClientRect();
