<style>
/* Layout: une colonne façon "dossier d'agent", écran par écran ; le jeu en cours passe en plein écran */
:root {
  --bg: #1a1221;
  --panel: #251a2f;
  --line: #3a2b46;
  --gc: #f3b54a;
  --paper: #f5eee3;
  --ink: #1d1328;
  --text: #f5eee3;
  --muted: #ad9db3;
  --signal: #f3b54a;
  --stamp: #d14f55;
  --good: #6fcf97;
  --warn: #f0a04b;
  --good-soft: rgba(111, 207, 151, .14);
  --warn-soft: rgba(240, 160, 75, .14);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { min-height: 100%; }
body { margin: 0; }
img { max-width: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
#app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--f-display); font-weight: 900; text-transform: none; line-height: .95; margin: 0; text-wrap: balance; font-stretch: 80%; }
h1 { font-size: clamp(2.3rem, 11vw, 3.4rem); letter-spacing: -.015em; overflow-wrap: anywhere; }
h2 { overflow-wrap: anywhere; }
h2 { font-size: 2rem; letter-spacing: -.01em; }
p { margin: 0; }
.eyebrow { font-family: var(--f-body); font-size: .85rem; font-weight: 600; color: var(--muted); }
.lead { color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 10px; }
.label { font-weight: 700; font-size: .95rem; }

button { font: inherit; cursor: pointer; border: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.btn {
  background: linear-gradient(180deg, #f7c467, var(--signal)); color: var(--ink); font-weight: 800; font-size: 1.05rem;
  padding: 16px 20px; border-radius: 14px; width: 100%;
  box-shadow: 0 4px 0 #b47c22; transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b47c22; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text); border: 1.5px solid rgba(245, 238, 227, .2); border-radius: 14px; padding: 13px 18px; font-weight: 600; width: 100%; }
.btn-small { background: var(--panel); color: var(--text); border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: .9rem; }
.btn-danger { background: var(--stamp); color: #fff; box-shadow: 0 4px 0 #9e3a3f; }
.back { background: none; color: var(--muted); font-weight: 600; padding: 10px 0; min-height: 44px; align-self: flex-start; }

input[type=text], textarea {
  width: 100%; box-sizing: border-box; font: inherit; color: var(--ink);
  background: var(--paper); border: 0; border-radius: 10px; padding: 12px 14px;
}
textarea { min-height: 120px; resize: vertical; font-family: var(--f-mono); font-size: .9rem; }

.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 44px; height: 44px; border-radius: 10px; background: var(--panel); color: var(--text); font-size: 1.4rem; font-weight: 700; }
.stepper output { font-family: var(--f-display); font-size: 2.2rem; font-weight: 900; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; font-stretch: 80%; }

.names { display: grid; gap: 8px; }
.name-row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.agent { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); letter-spacing: .08em; white-space: nowrap; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--panel); color: var(--text); border: 2px solid var(--line); border-radius: 999px; padding: 8px 14px; min-height: 42px; font-weight: 600; font-size: .92rem; transition: background .15s, border-color .15s, color .15s; }
.chip[aria-pressed=true] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.chip small { font-family: var(--f-mono); font-size: .7rem; opacity: .7; margin-left: 4px; }

.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--panel); border-radius: 12px; padding: 14px; }
.toggle .t-text { min-width: 0; }
.toggle .t-sub { color: var(--muted); font-size: .85rem; }
.switch { width: 58px; height: 34px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: var(--paper); transition: transform .15s; }
.switch[aria-checked=true] { background: var(--good); }
.switch[aria-checked=true]::after { transform: translateX(24px); }
.switch:disabled { opacity: .4; }

details.box { background: var(--panel); border-radius: 12px; padding: 14px; }
details.box summary { font-weight: 700; cursor: pointer; padding: 6px 0; min-height: 32px; }
details.box[open] summary { margin-bottom: 12px; }
.mytheme { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.mytheme span { min-width: 0; overflow-wrap: anywhere; }
.hint { font-size: .85rem; color: var(--muted); }
.msg { font-size: .9rem; color: var(--signal); min-height: 1.2em; }

/* Accueil */
.games { display: grid; gap: 12px; }

/* Carte / dossier */
.card {
  background: var(--paper); color: var(--ink); border-radius: 16px; padding: 24px 20px;
  display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center;
  position: relative; overflow: hidden;
}
.card .eyebrow { color: #6e5a79; }
.card .who { font-family: var(--f-display); font-weight: 900; font-size: 2.6rem; text-transform: none; line-height: 1; overflow-wrap: anywhere; font-stretch: 80%; }
.word { font-family: var(--f-display); font-weight: 900; font-size: 3.4rem; text-transform: uppercase; line-height: 1; overflow-wrap: anywhere; font-stretch: 80%; }
.redact { display: inline-block; background: var(--ink); color: var(--ink); border-radius: 4px; padding: 6px 18px; font-family: var(--f-display); font-weight: 900; font-size: 3rem; line-height: 1; user-select: none; font-stretch: 80%; }
.white-note { color: #6e5a79; font-size: .95rem; max-width: 30ch; }

.stamp {
  font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: 2.4rem;
  color: var(--stamp); border: 4px solid var(--stamp); border-radius: 8px; padding: 4px 14px;
  transform: rotate(-6deg); letter-spacing: .03em; animation: stamp .35s cubic-bezier(.2,1.6,.4,1) both; font-stretch: 80%; }
.stamp.civil { color: #2f8f5f; border-color: #2f8f5f; }
@keyframes stamp { from { transform: rotate(-6deg) scale(1.8); opacity: .3; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }

.progress { display: flex; gap: 6px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress i.done { background: var(--signal); }

.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: o; }
.order li { counter-increment: o; display: grid; grid-template-columns: 2.4rem 1fr; align-items: center; background: var(--panel); border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.order li::before { content: counter(o); font-family: var(--f-display); font-weight: 900; font-size: 1.6rem; color: var(--signal); font-stretch: 80%; }
.order li span { min-width: 0; overflow-wrap: anywhere; }

.vote { display: grid; gap: 8px; }
.vote button { text-align: left; background: var(--panel); color: var(--text); border: 2px solid var(--line); border-radius: 12px; padding: 14px; font-weight: 700; font-size: 1.05rem; display: flex; justify-content: space-between; gap: 10px; }
.vote button[aria-pressed=true] { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.vote button span { min-width: 0; overflow-wrap: anywhere; }

.recap { display: grid; gap: 6px; width: 100%; text-align: left; }
.recap-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 8px 0; border-top: 1px solid #e2d6c6; }
.recap-row span:first-child { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.role-tag { font-family: var(--f-mono); font-size: .75rem; padding: 3px 8px; border-radius: 6px; background: #ebe1d3; white-space: nowrap; }
.role-tag.uc { background: var(--stamp); color: #fff; }
.role-tag.mw { background: var(--ink); color: var(--paper); }
.out { text-decoration: line-through; opacity: .55; }

.scores { display: grid; gap: 4px; }
.score-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.score-row span:first-child { min-width: 0; overflow-wrap: anywhere; }
.score-row b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.score-row.lead-row span:first-child { color: var(--signal); font-weight: 700; }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.confirm { background: var(--panel); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }

/* Devine Tête : scène plein écran */
.stage {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: flex; flex-direction: column; gap: 10px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  transition: background .15s;
}
.stage.flash-ok { background: #2f8f5f; }
.stage.flash-ko { background: #c2571c; }
.stage-top { display: flex; align-items: center; gap: 12px; }
.timer { font-family: var(--f-display); font-weight: 900; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2.6ch; font-stretch: 80%; }
.timer.hot { color: #e3807a; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--signal); }
.stage-score { font-family: var(--f-mono); font-size: .85rem; white-space: nowrap; }
.stop { background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: .85rem; font-weight: 600; }
.zones { flex: 1; position: relative; display: grid; grid-template-rows: 1fr 1fr; gap: 8px; min-height: 0; }
.zone { border-radius: 16px; font-family: var(--f-mono); font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; display: flex; justify-content: center; padding: 14px; touch-action: manipulation; }
.zone.ok { background: var(--good-soft); color: var(--good); align-items: flex-start; }
.zone.ko { background: var(--warn-soft); color: var(--warn); align-items: flex-end; }
.big-word { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; padding: 0 12px; gap: 10px; }
.big-word b { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; line-height: .95; font-size: min(15vw, 17vh); overflow-wrap: anywhere; text-wrap: balance; max-width: 100%; font-stretch: 80%; }
.big-word span { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.countdown { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
.countdown b { font-family: var(--f-display); font-weight: 900; font-size: min(45vw, 45vh); line-height: 1; color: var(--signal); font-stretch: 80%; }

.how { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.how div { border-radius: 12px; padding: 12px; font-size: .9rem; }
.how .h-ok { background: var(--good-soft); color: var(--good); }
.how .h-ko { background: var(--warn-soft); color: var(--warn); }
.how b { display: block; font-family: var(--f-mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; }

.big-score { font-family: var(--f-display); font-weight: 900; font-size: 5rem; line-height: 1; color: var(--signal); font-stretch: 80%; }
.reslist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.reslist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--panel); font-weight: 600; }
.reslist li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.reslist li .tag { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.reslist li.ok .tag { color: var(--good); }
.reslist li.ko { opacity: .55; }
.reslist li.ko .tag { color: var(--warn); }

.face { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; min-height: 0; padding: 0 8px; }
.face b { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; line-height: .95; font-size: min(16vw, 20vh); overflow-wrap: anywhere; text-wrap: balance; max-width: 100%; font-stretch: 80%; }
.face span { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.stage > .bar { flex: none; }
.play-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.act-ok { background: var(--good); color: var(--ink); font-weight: 700; font-size: 1.2rem; padding: 18px; border-radius: 14px; }
.act-ko { background: var(--warn-soft); color: var(--warn); font-weight: 700; padding: 18px; border-radius: 14px; }

.quickjoin { display: flex; flex-direction: column; gap: 8px; }
.qj-row { display: flex; gap: 8px; }
.qj-row input { flex: 1; min-width: 0; }
.qj-row .btn { width: auto; padding: 12px 18px; }
.mode-btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; background: var(--paper); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 1rem; box-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
.mode-btn svg { width: 20px; height: 20px; flex: none; }
.mode-btn.on { background: var(--signal); }
.mode-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
.code-big { font-family: var(--f-display); font-weight: 900; font-size: 4.4rem; letter-spacing: .18em; line-height: 1; color: var(--signal); font-stretch: 80%; }
.code-input { text-transform: uppercase; letter-spacing: .3em; font-family: var(--f-mono); font-size: 1.2rem; }
.share { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.share code { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; min-width: 0; flex: 1 1 200px; }
.banner { background: var(--good-soft); color: var(--good); border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.qs-list { display: grid; gap: 8px; }
.qs-row { background: var(--panel); border: 2px solid transparent; border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.qs-row.cur { border-color: var(--signal); }
.qs-row.found { opacity: .6; }
.qs-row .who-n { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.qs-row .meta { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); white-space: nowrap; }
.qs-row .pick { grid-column: 1 / -1; font-family: var(--f-display); font-weight: 900; font-size: 1.9rem; text-transform: uppercase; line-height: 1; overflow-wrap: anywhere; font-stretch: 80%; }
.qs-row .pick.hidden { color: var(--muted); }
.voted { color: var(--good); }
.val-box { background: var(--panel); border: 2px solid var(--signal); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.val-box > b { font-size: 1.15rem; overflow-wrap: anywhere; }
.val-box p { margin: 0; }
.val-count { display: flex; gap: 12px; font-family: var(--f-mono); font-size: .85rem; color: var(--muted); }
.val-count .ok { color: var(--good); }
.val-count .ko { color: var(--warn); }
.val-box button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--paper); }
.qd-cards { display: grid; gap: 10px; }
.qd-card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.qd-card.mine { border-style: dashed; opacity: .8; }
.qd-card p { margin: 0; font-size: 1.1rem; font-weight: 600; overflow-wrap: anywhere; }
.qd-author { font-family: var(--f-display); font-size: 1.6rem; text-transform: none; color: var(--signal); font-stretch: 80%; }
.qd-guesses { display: flex; flex-wrap: wrap; gap: 6px; }
.qd-guesses span { font-size: .82rem; padding: 3px 9px; border-radius: 999px; background: var(--bg); }
.qd-guesses .ok { color: var(--good); }
.qd-guesses .ko { color: var(--warn); }
#o-qd { min-height: 90px; font-family: var(--f-body); font-size: 1rem; }
.dr-word { background: var(--paper); color: var(--ink); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.dr-word .eyebrow { color: #6e5a79; }
.dr-word b { font-family: var(--f-display); font-weight: 900; font-size: 2rem; text-transform: uppercase; line-height: 1; overflow-wrap: anywhere; font-stretch: 80%; }
.dr-word small { color: #6e5a79; max-width: 32ch; }
.dr-word.imp b { color: var(--stamp); }
.dr-wrap { border-radius: 16px; padding: 6px; background: var(--panel); }
.dr-wrap.active { background: var(--pc); box-shadow: 0 0 0 3px var(--signal); }
.dr-canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 12px; background: #fbfaf4; touch-action: none; }
.dr-order { display: flex; flex-wrap: wrap; gap: 6px; }
.dr-p { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel); font-weight: 600; font-size: .85rem; border: 2px solid transparent; }
.dr-p::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--pc); }
.dr-p.cur { border-color: var(--signal); }
.dr-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); display: inline-block; }
.char-avatar { display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 900; color: #fff; background: linear-gradient(135deg, hsl(var(--h) 55% 45%), hsl(calc(var(--h) + 40) 60% 30%)); font-stretch: 80%; }
.char-img.char-avatar { font-size: 3.6rem; }
.char-thumb.char-avatar { font-size: 1.1rem; }
.cat-img.char-avatar { font-size: 2rem; }
.char-loading { background: linear-gradient(90deg, rgba(127,127,160,.15), rgba(127,127,160,.3), rgba(127,127,160,.15)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.cat-box summary small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.cat-pairs { display: grid; gap: 6px; }
.cat-pair { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: var(--bg); color: var(--text); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
.cat-pair span { min-width: 0; overflow-wrap: anywhere; }
.cat-pair b { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
.cat-pair.off { opacity: .5; text-decoration: line-through; }
.cat-pair.off b { color: var(--stamp); text-decoration: none; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.cat-tile { background: var(--bg); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.cat-tile.off { opacity: .45; }
.cat-img { width: 100%; aspect-ratio: 1; max-width: 100%; object-fit: cover; object-position: top; border-radius: 10px; background: var(--line); }
.cat-name { font-weight: 700; font-size: .9rem; overflow-wrap: anywhere; }
.cat-acts { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.cat-acts .btn-small { font-size: .78rem; padding: 6px 8px; }
#cat-text { min-height: 140px; }
.char-fig { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.char-fig figcaption { font-size: .7rem; }
.char-fig figcaption a { color: #6e5a79; }
.char-img { width: 150px; height: 150px; object-fit: cover; object-position: top; border-radius: 14px; background: #ebe1d3; box-shadow: 0 6px 16px rgba(29, 19, 40, .25); }
.char-thumb { width: 52px; height: 52px; object-fit: cover; object-position: top; border-radius: 9px; background: var(--line); flex: none; }
.qs-row .pick { display: flex; align-items: center; gap: 10px; }
.with-thumb { display: flex; align-items: center; gap: 8px; }
.photo-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.photo-btn { cursor: pointer; }
.photo-prev { width: 52px; height: 52px; object-fit: cover; border-radius: 10px; }

/* Loup-Garou : décors nuit / jour */
body { transition: background-color .9s ease, color .9s ease; }
body[data-scene="night"] { --bg: #120c1b; --panel: #1f1530; --line: #33264a; --muted: #ad9db3; }
body[data-scene="day"] { --bg: #f2e6c9; --panel: #e5d4ab; --line: #cdb98a; --text: #2b2116; --muted: #6e5b3f; --good: #1f8a54; --warn: #b85a12; --good-soft: rgba(31, 138, 84, .14); --warn-soft: rgba(184, 90, 18, .14); }
body[data-scene="day"] .btn-small { color: var(--text); }
.lg { display: flex; flex-direction: column; gap: 18px; }
.lg-scene { display: block; width: 100%; height: auto; max-width: 100%; aspect-ratio: 400 / 150; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
.lg-star { fill: #fff; animation: lg-tw 3.2s ease-in-out infinite; }
@keyframes lg-tw { 50% { opacity: .2; } }
.lg-bar { display: flex; gap: 8px; flex-wrap: wrap; }
.lg-bar .btn-small[aria-pressed="false"] { opacity: .7; }
.lg-peek { display: flex; flex-direction: column; gap: 8px; }

/* Cartes de rôle */
.lg-card {
  background: radial-gradient(120% 90% at 50% 15%, rgba(255, 255, 255, .16), transparent 60%), var(--rc);
  color: #f7f4ff; border-radius: 18px; padding: 22px 18px 20px; display: flex; flex-direction: column; align-items: center;
  text-align: center; gap: 8px; position: relative; overflow: hidden;
  box-shadow: 0 12px 30px rgba(0, 0, 0, .35), inset 0 0 0 3px rgba(255, 255, 255, .1);
}
.lg-card::before { content: ""; position: absolute; inset: 8px; border: 1.5px solid rgba(255, 255, 255, .22); border-radius: 12px; pointer-events: none; }
.lg-art svg { width: 140px; height: 140px; display: block; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .35)); }
.lg-name { font-family: var(--f-display); font-weight: 900; font-size: 2.3rem; text-transform: uppercase; line-height: 1; letter-spacing: .01em; font-stretch: 80%; }
.lg-team { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: rgba(0, 0, 0, .3); }
.lg-desc { font-size: .95rem; opacity: .92; max-width: 32ch; margin: 0; }
.lg-card.sm { padding: 14px 12px; gap: 6px; }
.lg-card.sm .lg-art svg { width: 76px; height: 76px; }
.lg-card.sm .lg-name { font-size: 1.4rem; }
.lg-mini { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 600; background: var(--rc); color: #f7f4ff; padding: 3px 9px 3px 4px; border-radius: 999px; }
.lg-mini svg { width: 22px; height: 22px; }
.lg-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--rc); color: #f7f4ff; padding: 5px 12px 5px 5px; border-radius: 999px; font-weight: 600; font-size: .88rem; }
.lg-chip svg { width: 28px; height: 28px; }
.lg-comp { display: flex; flex-wrap: wrap; gap: 8px; }
.lg-rolechip { display: inline-flex; align-items: center; gap: 6px; padding-left: 6px; }
.lg-rolechip svg { width: 24px; height: 24px; }

/* Carte qui se retourne */
.flip { perspective: 1200px; cursor: pointer; }
.flip-in { position: relative; min-height: 400px; transition: transform .8s cubic-bezier(.2, .8, .2, 1); transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.flip-front, .flip-back { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip-back { transform: rotateY(180deg); }
.flip-back .lg-card { height: 100%; box-sizing: border-box; justify-content: center; }
.flip-front {
  border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #eadff0;
  background: repeating-linear-gradient(45deg, #2a1c38 0 14px, #24182f 14px 28px); border: 3px solid #3d2b4d; box-shadow: 0 12px 30px rgba(0, 0, 0, .35);
}
.flip-front svg { width: 150px; height: 150px; }
.flip-front b { font-family: var(--f-mono); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }

.lg-sleep { display: flex; justify-content: center; }
.lg-sleep svg { width: 120px; height: 120px; opacity: .85; }
.lg-potion { align-self: flex-start; }
.lg-plist { display: grid; gap: 6px; }
.lg-prow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border-radius: 10px; }
.lg-prow.dead { opacity: .6; }
.lg-prow.dead .lg-pname { text-decoration: line-through; }
.lg-pname { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.lg-pstate { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.lg-rip { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.lg-heart { color: #ff5f8f; }
.lg-deaths { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.lg-death { display: flex; flex-direction: column; gap: 6px; text-align: center; }
.lg-death p { margin: 0; font-size: .9rem; }
.lg-timer { font-family: var(--f-display); font-weight: 900; font-size: 3.4rem; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; font-stretch: 80%; }
.lg-timer.hot { color: var(--stamp); }
.lg-tally { display: grid; gap: 6px; }
.lg-trow { display: grid; grid-template-columns: minmax(0, 1fr) 2fr auto; gap: 10px; align-items: center; font-weight: 600; }
.lg-trow span { overflow-wrap: anywhere; }
.lg-trow i { display: block; height: 10px; border-radius: 5px; background: var(--stamp); width: var(--w); }
.lg-trow b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.lg-endgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.lg-endcard { display: flex; flex-direction: column; gap: 4px; text-align: center; }
.lg-endcard.dead .lg-card { filter: grayscale(.6) brightness(.8); }
.lg-endcard.won .lg-card { box-shadow: 0 0 0 3px var(--signal), 0 12px 30px rgba(0, 0, 0, .35); }
.lg-endcard span { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.lg-log { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: .9rem; }
.lg-force { opacity: .75; }
.lg-roles { display: grid; gap: 8px; }
.lg-roleopt { display: grid; grid-template-columns: 52px minmax(0, 1fr) 28px; align-items: center; gap: 12px; text-align: left; background: var(--panel); color: var(--text); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.lg-roleopt.base { grid-template-columns: 52px minmax(0, 1fr); background: var(--bg); }
.lg-roleopt.on { border-color: var(--signal); background: color-mix(in srgb, var(--rc) 55%, var(--panel)); }
.lg-ro-art { width: 52px; height: 52px; border-radius: 12px; background: var(--rc); display: flex; align-items: center; justify-content: center; }
.lg-ro-art svg { width: 42px; height: 42px; }
.lg-ro-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lg-ro-txt small { color: var(--muted); font-size: .82rem; line-height: 1.35; }
.lg-roleopt.on .lg-ro-txt small { color: var(--text); opacity: .85; }
.lg-ro-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--ink); }
.lg-roleopt.on .lg-ro-check { background: var(--signal); border-color: var(--signal); }
.lg-help p { margin: 0 0 8px; font-size: .92rem; }
.lg-rules { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: .92rem; }
.stepper .btn-small { width: auto; height: auto; font-size: .9rem; padding: 10px 14px; }
.btn-small[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
.vote button:disabled { opacity: .4; cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) { .flip-in { transition: none; } .lg-star { animation: none; } body { transition: none; } }

@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#app.enter > :not(.topbar):not(.sheet):not(.sheet-back) { animation: enter .3s cubic-bezier(.2, .8, .3, 1) both; }
.btn-small, .btn-ghost, .mode-btn, .vote button, .lg-roleopt, .cat-pair { transition: transform .08s, background .15s, border-color .15s; }
.btn-small:active, .btn-ghost:active, .vote button:active, .lg-roleopt:active, .chip:active { transform: scale(.97); }
@media (prefers-reduced-motion: reduce) { #app.enter > * { animation: none; } .chip, .switch, .btn-small, .btn-ghost, .mode-btn, .vote button, .lg-roleopt { transition: none; } }

@media (prefers-reduced-motion: reduce) {
  .stamp { animation: none; }
  .btn, .switch::after, .stage { transition: none; }
}

/* La Bombe */
.bomb-theme { font-family: var(--f-display); font-weight: 900; font-size: clamp(2rem, 9vw, 3rem); line-height: 1.05; text-transform: none; overflow-wrap: anywhere; font-stretch: 80%; }
.bomb-theme.small { font-size: clamp(1.4rem, 6vw, 2rem); text-align: center; margin: 0; }
.bomb-letter { display: block; font-size: .55em; color: var(--signal); }
.bomb-stage { display: grid; place-items: center; padding: 6px 0; }
.bomb-art { width: min(52vw, 220px); }
.bomb-art svg { width: 100%; height: auto; display: block; }
.bomb-art.lit { animation: bomb-pulse .65s ease-in-out infinite; }
.bomb-art.lit[data-speed="2"] { animation-duration: .38s; }
.bomb-art.lit[data-speed="3"] { animation-duration: .19s; }
.bomb-art.lit .spark { animation: bomb-spark .2s steps(2) infinite; transform-origin: 98px 10px; }
@keyframes bomb-pulse { 50% { transform: scale(1.07) rotate(-3deg); } }
@keyframes bomb-spark { 50% { transform: scale(.7); opacity: .6; } }
.bomb-play { display: flex; flex-direction: column; gap: 10px; text-align: center; }
.bomb-play .eyebrow { margin: 0; }
.bomb-holder { font-family: var(--f-display); font-weight: 900; font-size: clamp(2.6rem, 13vw, 4rem); line-height: 1; margin: 0; color: var(--signal); overflow-wrap: anywhere; font-stretch: 80%; }
.bomb-pass { min-height: 26vh; font-size: 1.5rem; }
.bomb-boom { text-align: center; display: flex; flex-direction: column; gap: 10px; }
.boom-word { font-family: var(--f-display); font-weight: 900; font-size: clamp(4rem, 24vw, 7rem); line-height: .9; margin: 0; color: #ee8b4c; animation: boom-in .5s cubic-bezier(.2, 1.6, .4, 1); font-stretch: 80%; }
.bomb-loser { font-size: clamp(2.4rem, 12vw, 3.6rem); margin: 0; overflow-wrap: anywhere; }
@keyframes boom-in { from { transform: scale(2.4); opacity: 0; } }
/* Tu préfères */
.tp-choices { display: grid; gap: 10px; }
.tp-opt { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; min-height: 96px; padding: 18px; border-radius: 16px; border: 3px solid transparent; font: inherit; font-weight: 700; font-size: 1.2rem; line-height: 1.25; color: var(--ink); cursor: pointer; }
div.tp-opt { cursor: default; }
.tp-opt.a { background: color-mix(in srgb, #e3807a 82%, var(--paper)); }
.tp-opt.b { background: color-mix(in srgb, #7eb3dd 82%, var(--paper)); }
.tp-opt[aria-pressed="true"] { border-color: var(--signal); box-shadow: 0 0 0 3px var(--signal); }
.tp-opt[aria-pressed="false"] { opacity: .85; }
.tp-tag { flex: none; width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: rgba(29, 19, 40, .15); font-family: var(--f-display); font-weight: 900; font-stretch: 80%; }
.tp-or { text-align: center; font-family: var(--f-display); font-weight: 900; font-size: 1.4rem; text-transform: none; color: var(--muted); font-stretch: 80%; }
.tp-results { display: grid; gap: 12px; }
.tp-res { background: var(--panel); border-radius: 14px; padding: 14px; display: grid; gap: 8px; border-left: 5px solid #e3807a; border: 1px solid var(--line); border-left-width: 5px; border-left-color: #e3807a; }
.tp-res.b { border-left-color: #7eb3dd; }
.tp-res-head { display: flex; gap: 12px; align-items: baseline; }
.tp-res-head b { font-family: var(--f-display); font-size: 1.8rem; font-weight: 900; color: var(--signal); white-space: nowrap; min-width: 3.4ch; font-stretch: 80%; }
.tp-names { margin: 0; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bomb-art.lit, .bomb-art.lit .spark, .boom-word { animation: none; } }

/* =========================================================
   Direction « Nuit de jeux » : velours prune, cartes ivoire,
   lumière ambrée. Une seule lumière pour tout le site ; chaque
   jeu garde une teinte douce, réservée à son illustration.
   ========================================================= */
body { position: relative; }
body:not([data-scene])::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(90vmax 60vmax at 50% -22%, rgba(243, 181, 74, .16), transparent 62%),
    radial-gradient(60vmax 50vmax at 100% 110%, rgba(167, 154, 227, .08), transparent 60%),
    radial-gradient(140% 100% at 50% 50%, transparent 55%, rgba(8, 4, 12, .55));
}
body:not([data-scene])::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity 1.2s;
  background: radial-gradient(70vmax 55vmax at 50% 20%, rgba(243, 181, 74, .22), transparent 65%);
}
body.celebrate:not([data-scene])::after { opacity: 1; transition-duration: .3s; }
#app[data-view="home"], #app[data-view="stats"] { max-width: 1120px; }
#app[data-view="catalog"] { max-width: 860px; }

/* Logo : le point du i est un jeton ambré */
.logo { font-family: var(--f-display); font-weight: 800; font-stretch: 86%; letter-spacing: -.012em; line-height: .82; color: var(--text); text-transform: none; margin: 0; }
.logo .ii { position: relative; display: inline-block; }
.logo .ii i { position: absolute; left: 56%; top: -.01em; width: .17em; height: .17em; border-radius: .045em; background: var(--signal); transform: translateX(-50%) rotate(14deg); box-shadow: 0 .03em 0 #b47c22; }
.logo.intro .ii i { animation: dot-drop .9s .35s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes dot-drop { 0% { transform: translate(-50%, -1.4em) rotate(-120deg); opacity: 0; } 60% { opacity: 1; } }

/* Barre du haut */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; margin-bottom: -4px; }
.tb-home { background: none; color: var(--text); display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 0; min-height: 44px; min-width: 0; }
.tb-home::before { content: ""; width: 9px; height: 9px; border-left: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: rotate(45deg); margin: 0 2px 0 4px; opacity: .6; flex: none; }
.tb-home .logo { font-size: 1.75rem; white-space: nowrap; flex: none; }
.crumb { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: .92rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gc); flex: none; }
.tb-right { display: flex; gap: 8px; flex: none; }
.tb-btn { width: 44px; height: 44px; border-radius: 50%; background: rgba(245, 238, 227, .06); color: var(--text); border: 1px solid rgba(245, 238, 227, .1); display: grid; place-items: center; transition: transform .12s, background .15s, color .15s; }
.tb-btn svg { width: 21px; height: 21px; }
.tb-btn[aria-pressed="false"] { color: var(--muted); }
.tb-btn[aria-current="page"] { background: var(--signal); color: var(--ink); border-color: var(--signal); }
.tb-btn:active { transform: scale(.9); }
body[data-scene="day"] .tb-btn { background: rgba(43, 33, 22, .07); border-color: rgba(43, 33, 22, .15); }

/* Accueil : le jeu de cartes */
.home-top { display: grid; gap: 22px; }
.hero { display: grid; gap: 14px; min-width: 0; }
.hero .logo { font-size: clamp(5rem, 27vw, 9.5rem); }
.hero-list { color: var(--muted); font-size: 1rem; line-height: 1.5; max-width: 34ch; }
.hand { position: relative; height: 128px; margin: -8px auto 0; width: min(100%, 360px); }
.hand-card { position: absolute; left: 50%; bottom: 0; width: 74px; height: 104px; margin-left: -37px; border-radius: 12px; background: var(--paper); padding: 0;
  transform-origin: 50% 240%; transform: rotate(var(--r)) translateY(var(--y, 0));
  box-shadow: 0 10px 22px -8px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(29, 19, 40, .08);
  display: grid; place-items: start; padding: 9px 0 0 7px; transition: transform .35s cubic-bezier(.2, 1.4, .4, 1); }
.hand-card::before { content: ""; position: absolute; inset: 5px; border-radius: 8px; background: linear-gradient(160deg, color-mix(in srgb, var(--gc) 45%, var(--paper)), color-mix(in srgb, var(--gc) 18%, var(--paper))); }
.hand-card svg { position: relative; width: 34px; height: 34px; filter: drop-shadow(0 2px 2px rgba(29, 19, 40, .25)); }
.hand.intro .hand-card { animation: deal .8s cubic-bezier(.2, 1.1, .3, 1) both; animation-delay: calc(var(--k) * 55ms + .15s); }
@keyframes deal { from { transform: rotate(0deg) translateY(30px); opacity: 0; } }
@media (hover: hover) { .hand-card:hover { --y: -14px; } }
.hand-card:focus-visible { --y: -14px; }

.crew { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 14px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04); }
.crew-count { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.crew-count .label { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 1.55rem; line-height: 1; letter-spacing: -.01em; flex: 1 1 auto; }
.crew-count .stepper button { background: rgba(245, 238, 227, .07); border: 1px solid var(--line); }
.crew-fit { color: var(--muted); font-size: .88rem; flex-basis: 100%; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(8, 4, 12, .35); }
.seg button { flex: 1 1 0; min-width: 0; background: none; color: var(--muted); border-radius: 10px; padding: 8px 6px; min-height: 44px; font-weight: 700; font-size: .88rem; line-height: 1.15; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
@media (min-width: 700px) {
  .hand { height: 170px; width: 440px; margin-top: 0; }
  .hand-card { width: 92px; height: 128px; margin-left: -46px; padding: 11px 0 0 9px; }
  .hand-card svg { width: 42px; height: 42px; }
}
@media (min-width: 1040px) {
  .home-top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; column-gap: 32px; }
  .home-top .crew { grid-column: 1 / -1; grid-template-columns: auto 1fr; align-items: center; column-gap: 28px; }

let imgQueue = [], imgActive = 0, renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 250); }
function imgSchedule(fn) { imgQueue.push(fn); imgPump(); }
function imgPump() {
  while (imgActive < 3 && imgQueue.length) {
    const fn = imgQueue.shift();
    imgActive++;
    fn().catch(() => {}).finally(() => { imgActive--; imgPump(); });

let jikanNext = 0;
async function jikanFind(q) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const wait = Math.max(0, jikanNext - Date.now());
    jikanNext = Math.max(Date.now(), jikanNext) + 500;
    if (wait) await new Promise(r => setTimeout(r, wait));
    const r = await fetch(`https://api.jikan.moe/v4/characters?q=${encodeURIComponent(q)}&order_by=favorites&sort=desc&limit=1`);
    if (r.status === 429) { jikanNext = Date.now() + 1500; continue; }
    if (!r.ok) return null;
    const d = ((await r.json()).data || [])[0];
    const url = d && d.images && ((d.images.jpg && d.images.jpg.image_url) || (d.images.webp && d.images.webp.image_url));
    return url && !/questionmark/i.test(url) ? { url, page: d.url, credit: "MyAnimeList" } : null;
  }
  return null;
}
async function wikiApi(lang, params) {
  const r = await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=360&pilicense=any&redirects=1&${params}`);
  if (!r.ok) return [];
  const j = await r.json();
  return Object.values((j.query && j.query.pages) || {}).sort((a, b) => (a.index || 0) - (b.index || 0));
}
const wikiHit = (lang, p) => ({ url: p.thumbnail.source, page: `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(p.title.replace(/ /g, "_"))}`, credit: "Wikipédia" });
async function wikiFind(it) {
  const core = imgWords(it.q.replace(/\s*\(.*\)\s*/g, " "));
  for (const lang of it.lang) {
    if (!it.strict) {
      const direct = await wikiApi(lang, "titles=" + encodeURIComponent(it.q));
      const d = direct.find(p => p.thumbnail && !p.missing);
      if (d) return wikiHit(lang, d);
    }
    const found = await wikiApi(lang, `generator=search&gsrnamespace=0&gsrlimit=6&gsrsearch=${encodeURIComponent((it.q + " " + it.hint).trim())}`);
    const s = found.find(p => p.thumbnail && imgWords(p.title).includes(core));
    if (s) return wikiHit(lang, s);
  }
  return null;
}

}
function loadImg(key, it) {
  const direct = imgFor(it);
  if (direct) { IMG[key] = direct; return; }
  const cached = store.get("img2_" + key, undefined);
  if (cached !== undefined) { IMG[key] = cached; return; }
  IMG[key] = "pending";
  imgSchedule(async () => {
    let res = null;
    try { res = it.s === "anime" ? await jikanFind(it.q) : await wikiFind(it); } catch (e) { res = null; }
    if (!res && it.s === "anime") { try { res = await wikiFind({ q: it.q, lang: ["en", "fr"], hint: "character" }); } catch (e) {} }
    IMG[key] = res;
    store.set("img2_" + key, res);
    scheduleRender();
  });
}
function avatar(name, cls) {
  const n = String(name || "?");
  let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) % 360;
  const ini = n.split(/[\s'-]+/).filter(Boolean).slice(0, 2).map(x => x[0]).join("").toUpperCase();
  return `<div class="${cls} char-avatar" style="--h:${h}" aria-hidden="true">${esc(ini)}</div>`;
}
function charImg(pick, cls) {
  if (!pick) return "";
  const c = cls || "char-img";
  if (pick.img && PHOTO_RE.test(pick.img)) return `<img class="${c}" src="${pick.img}" alt="">`;
  const it = itemFor(pick);
  if (!it) return avatar(pick.w, c);
  if (CUR.bad.includes(dtKey(catIdByName(pick.c), pick.w))) return avatar(pick.w, c);
  const key = (pick.c || "") + "|" + pick.w;
  if (IMG[key] === undefined) loadImg(key, it);
  const r = IMG[key];
  if (r === "pending") return `<div class="${c} char-loading" aria-hidden="true"></div>`;
  if (!r) return avatar(pick.w, c);
  const img = `<img class="${c}" src="${esc(r.url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=this.dataset.fb" data-fb="${esc(avatar(pick.w, c))}">`;
  if (c !== "char-img") return img;
  return `<figure class="char-fig">${img}<figcaption>${r.page ? `<a href="${esc(r.page)}" target="_blank" rel="noopener">Image : ${esc(r.credit)}</a>` : `Image : ${esc(r.credit)}`}</figcaption></figure>`;
}

function readPhoto(file, cb) {
  if (!file || !/^image\//.test(file.type)) return cb(null);
  const r = new FileReader();
  r.onerror = () => cb(null);
  r.onload = () => {
    const im = new Image();
    im.onerror = () => cb(null);
    im.onload = () => {
      const k = Math.min(1, 256 / Math.max(im.width, im.height));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(im.width * k)); cv.height = Math.max(1, Math.round(im.height * k));
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL("image/jpeg", 0.72));
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}

function pickPair() {
  const pool = [];
  const sel = cfg.themes.includes("all") ? allThemes() : allThemes().filter(t => cfg.themes.includes(t.id));
  sel.forEach(t => ucPairs(t).forEach(p => pool.push({ theme: t.name, pair: p })));
  if (!pool.length) return null;
  let fresh = pool.filter(x => !used.has(x.pair.join("|")));
  if (!fresh.length) { used.clear(); fresh = pool; }
  const pick = fresh[Math.floor(Math.random() * fresh.length)];
  used.add(pick.pair.join("|"));
  const flip = Math.random() < .5;
  return { theme: pick.theme, civil: flip ? pick.pair[1] : pick.pair[0], uc: flip ? pick.pair[0] : pick.pair[1] };
}

function startGame() {
  oKeepAwake();
  const p = pickPair();
  if (!p) { ui.msg = "Choisis au moins un thème qui contient des mots."; render(); return; }
  const n = cfg.count;
  const useWhite = cfg.white && n >= 4;
  const roles = Array(n).fill("civil");
  const idx = shuffle([...Array(n).keys()]);
  roles[idx[0]] = "uc";
  if (n >= 7) roles[idx[1]] = "uc";
  if (useWhite) roles[idx[n >= 7 ? 2 : 1]] = "white";
  G = {
    theme: p.theme, civilWord: p.civil, ucWord: p.uc, round: 1,
    players: roles.map((r, i) => ({ name: nameOf(i), role: r, word: r === "civil" ? p.civil : r === "uc" ? p.uc : null, alive: true })),
    revealIdx: 0, revealOpen: false, order: [], lastOut: null, winner: null, whiteGuess: null, scored: false
  };
  G.order = speakOrder();
  ui = { screen: "reveal", msg: "", voteSel: null, confirmReset: false, peek: null, peekOpen: false };
  render();
}

function speakOrder() {
  let o = shuffle(G.players.map((p, i) => i).filter(i => G.players[i].alive));
  if (o.length > 1 && G.players[o[0]].role === "white") o.push(o.shift());
  return o;
}

function eliminate(i) {
  G.players[i].alive = false;
  G.lastOut = i;
  ui.voteSel = null;
  ui.screen = G.players[i].role === "white" ? "whiteGuess" : "outcome";
  render();
}

function checkWin() {
  const alive = G.players.filter(p => p.alive);
  const civ = alive.filter(p => p.role === "civil").length;
  const imp = alive.length - civ;
  if (imp === 0) return "civils";
  if (civ <= 1) return "impostors";
  return null;
}

function afterOutcome() {
  const w = checkWin();
  if (w) return endGame(w);
  G.round++;
  G.order = speakOrder();
  ui.screen = "talk"; render();
}

function endGame(w) {
  G.winner = w;
  if (!G.scored) {
    G.players.forEach(p => {
      let pts = 0;
      if (w === "civils" && p.role === "civil") pts = POINTS.civil;
      if (w === "impostors" && p.alive && p.role !== "civil") pts = POINTS[p.role];
      if (w === "white" && p.role === "white") pts = POINTS.white;
      scores[p.name] = (scores[p.name] || 0) + pts;
    });
    G.scored = true;
    store.set("scores", scores);
    histAdd({ g: "uc", m: "local", p: G.players.map(p => p.name), w: G.players.filter(p => (w === "civils" && p.role === "civil") || (w === "impostors" && p.alive && p.role !== "civil") || (w === "white" && p.role === "white")).map(p => p.name), x: { win: w } });
  }
  ui.screen = "end"; render();

   QUI SUIS-JE (un seul écran partagé, une question chacun)

let dcfg = Object.assign({ count: 3, names: ["", "", ""], cats: ["all"], sound: true }, store.get("dcfg", {}));
{ const ids = new Set(DT_CATS.map(c => c.id)); dcfg.cats = (dcfg.cats || []).filter(x => x === "all" || ids.has(x)); if (!dcfg.cats.length) dcfg.cats = ["all"]; }
let D = { screen: "setup", wins: {}, game: null, msg: "", draft: "", reveal: false, confirmEnd: false };
let dUsed = new Set();
let actx = null;

const dName = i => (dcfg.names[i] || "").trim() || "Joueur " + (i + 1);
const dSave = () => store.set("dcfg", dcfg);
const listNames = a => a.length <= 1 ? a.join("") : a.slice(0, -1).join(", ") + " et " + a[a.length - 1];
const othersOf = i => D.game.players.filter((p, j) => j !== i).map(p => p.name);

function dPool() {
  const sel = dcfg.cats.includes("all") ? DT_CATS : DT_CATS.filter(c => dcfg.cats.includes(c.id));
  const out = [];
  sel.forEach(c => dtItems(c).forEach(it => out.push({ w: it.w, c: c.name })));
  return out;
}
function dDraw1() {
  const pool = dPool();
  const taken = D.game ? D.game.players.filter(p => p.pick).map(p => p.pick.w) : [];
  let fresh = pool.filter(x => !dUsed.has(x.w) && !taken.includes(x.w));
  if (!fresh.length) { dUsed.clear(); fresh = pool.filter(x => !taken.includes(x.w)); }
  if (!fresh.length) fresh = pool;
  const p = fresh[Math.floor(Math.random() * fresh.length)];
  dUsed.add(p.w);
  return Object.assign({}, p);
}
function initAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.resume) actx.resume(); } catch (e) { actx = null; } }
function beep(f, d = .12, type = "sine", vol = .2) {
  if (!prefs.sound || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}

function dNewGame() {
  oKeepAwake();
  if (!dPool().length) { D.msg = "Choisis au moins une catégorie."; return; }
  D.game = {
    players: [...Array(dcfg.count).keys()].map(i => ({ name: dName(i), pick: null, rerolls: 0, found: false, q: 0, rank: null })),
    assign: 0, cur: 0, turn: 1, foundCount: 0, lastFound: null
  };
  D.reveal = false; D.confirmEnd = false; D.draft = "";
  D.screen = "assignReady";
}
function dStartAssign() {
  D.draftImg = null;
  const p = D.game.players[D.game.assign];
  if (!p.pick) p.pick = dDraw1();
  D.draft = "";
  D.screen = "assignPick";
}
function dReroll() { const p = D.game.players[D.game.assign]; p.pick = dDraw1(); p.rerolls++; }
function dCustom() {
  const t = (D.draft || "").trim();
  if (!t) { D.msg = "Écris un nom avant de valider."; return; }
  D.game.players[D.game.assign].pick = { w: t, c: "Choisi par " + listNames(othersOf(D.game.assign)), img: D.draftImg || null };
  D.draft = ""; D.draftImg = null;
}
function dValidate() {
  const g = D.game;
  g.assign++;
  if (g.assign < g.players.length) { D.screen = "assignReady"; return; }
  g.cur = Math.floor(Math.random() * g.players.length);
  D.reveal = false;
  D.screen = "turn";
}
function nextAlive(from) {
  const g = D.game, n = g.players.length;
  for (let k = 1; k <= n; k++) { const j = (from + k) % n; if (!g.players[j].found) return j; }
  return -1;
}
function dAsked() {
  const g = D.game;
  g.players[g.cur].q++;
  const nx = nextAlive(g.cur);
  if (nx <= g.cur) g.turn++;
  g.cur = nx;
  D.reveal = false;
}
function dFound() {
  const g = D.game, p = g.players[g.cur];
  initAudio();
  p.q++; p.found = true; p.rank = ++g.foundCount;
  g.lastFound = g.cur;
  beep(988, .12); setTimeout(() => beep(1318, .2), 100);
  D.reveal = false;
  D.screen = "found";
}
function dAfterFound() {
  const g = D.game;
  if (g.players.every(p => p.found)) return dFinish();
  const nx = nextAlive(g.lastFound);
  if (nx <= g.lastFound) g.turn++;
  g.cur = nx;
  D.screen = "turn";
}
function dFinish() {
  const g = D.game;
  const first = g.players.find(p => p.rank === 1);
  if (first && !g.scored) { D.wins[first.name] = (D.wins[first.name] || 0) + 1; g.scored = true; }
  if (!g.recorded) { g.recorded = true; histAdd({ g: "dt", m: "local", p: g.players.map(p => p.name), w: first ? [first.name] : [], x: first ? { bestQ: first.q, bestBy: first.name } : {} }); }
  D.confirmEnd = false; D.reveal = false;
  D.screen = "end";
}

}

function vDFound() {
  const g = D.game, p = g.players[g.lastFound];
  const all = g.players.every(x => x.found);
  return `<header class="section">
    <span class="eyebrow">${p.rank === 1 ? "Premier à trouver" : p.rank + "e à trouver"}</span>

function vDEnd() {

  <button class="btn-ghost" data-act="d-setup">Réglages</button>`;

/* ---------- Connexion Firebase (Realtime Database + connexion anonyme) ----------
   L'hôte garde l'état de la partie. Chaque joueur écrit ses actions dans rooms/CODE/actions/<uid>
   et lit uniquement sa propre vue dans rooms/CODE/views/<uid> (protégé par les règles). */
const FB_CONFIG = {
  apiKey: "AIzaSyAjO5u6aOL5gbyoOseY9XYRuALDe3Tsuwo",
  authDomain: "simwar-jeux.firebaseapp.com",
  databaseURL: "https://simwar-jeux-default-rtdb.europe-west1.firebasedatabase.app",
