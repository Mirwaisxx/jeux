  if (vd.tie) main = `<h2>Égalité</h2><p class="lead">Le village n'arrive pas à se décider. Personne n'est éliminé.</p></header>`;
  else if (vd.idiot) main = `<h2>${esc(vd.name)} est l'Idiot du village !</h2><p class="lead">Le village l'épargne en riant, mais il ne votera plus.</p></header>${lgCard("idiot", { desc: false, small: true })}`;
  else main = `<h2>${esc(vd.name)} est éliminé</h2></header>${lgDeathsBlock(vd.deaths)}`;
  return `<header class="section"><span class="eyebrow">Jour ${g.dayNo} · verdict</span>${main}
    ${vd.votes.length ? `<details class="box"><summary>Les votes</summary><div class="scores">${vd.votes.map(([a, b]) => `<div class="score-row"><span>${esc(a)}</span><b>→ ${esc(b)}</b></div>`).join("")}${vd.raven ? `<div class="score-row"><span>Corbeau</span><b>+2 → ${esc(vd.raven)}</b></div>` : ""}</div></details>` : ""}
    ${v.isHost ? `<button class="btn" data-act="o-send" data-a="lg-continue">${vd.pendingHunter ? "Continuer" : "La nuit tombe"}</button>` : `<p class="hint">En attente de l'hôte.</p>`}`;
}
function lgVHunter(v, g) {
  return `<header class="section"><span class="eyebrow">Dernier souffle</span><h2>${esc(g.hunter)} était chasseur</h2></header>
    ${lgCard("hunter", { desc: false, small: true })}
    ${g.amHunter ? `<p class="lead">Choisis qui tu emportes avec toi.</p>${lgPickList(g)}<button class="btn btn-danger" data-act="o-lgsend" data-a="lg-shoot" data-k="sel" ${O.sel ? "" : "disabled"}>Tirer</button>`
      : `<p class="lead">Il épaule son fusil et vise…</p>`}
    ${lgForceBtn(v, "Passer (chasseur absent)")}`;
}
function lgVEnd(v, g) {
  const title = { village: "Le village a gagné", wolves: "Les loups ont gagné", white: "Le Loup Blanc gagne seul", lovers: "Les amoureux ont gagné", none: "Personne n'a survécu" }[g.winner];
  const won = pid => g.winners.includes(pid);
  return `<header class="section"><span class="eyebrow">Fin de partie · ${LG_VILLAGE}</span><h1 style="font-size:3rem">${title}</h1></header>
    <div class="lg-endgrid">${g.players.map(p => `<div class="lg-endcard ${won(p.pid) ? "won" : ""} ${p.alive ? "" : "dead"}">${lgCard(p.role, { desc: false, small: true })}<b>${esc(p.name)}${p.lover ? " ♥" : ""}</b><span>${won(p.pid) ? "gagnant" : p.alive ? "vivant" : "mort"}</span></div>`).join("")}</div>
    ${g.log.length ? `<details class="box"><summary>Journal de la partie</summary><ol class="lg-log">${g.log.map(l => `<li>${esc(l)}</li>`).join("")}</ol></details>` : ""}
    ${scoreBlock(v)}
    ${v.isHost ? `<button class="btn" data-act="o-send" data-a="again">Rejouer</button><button class="btn-ghost" data-act="o-send" data-a="lobby">Retour au lobby</button>` : `<p class="hint">En attente de l'hôte.</p>`}`;
}
function fmtClock(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
setInterval(() => {
  document.querySelectorAll("[data-deadline]").forEach(el => {
    const left = +el.dataset.deadline - Date.now();
    el.textContent = left > 0 ? fmtClock(left) : "Temps écoulé";
    el.classList.toggle("hot", left <= 10000);
  });
}, 500);

function lgLobbySettings(v) {
  const st = v.settings.lg;
  const n = v.players.length;
  const c = lgComposition(Math.max(n, 4), st);
  const chips = LG_SPECIALS.map(r => `<button class="chip lg-rolechip" data-act="o-send" data-a="lg-set" data-x="role:${r}" aria-pressed="${st.roles.includes(r)}">${LG_ART[r]}${LG_ROLES[r].name}</button>`).join("");
  const debates = [[0, "Sans chrono"], [120, "2 min"], [180, "3 min"], [300, "5 min"]];
  return `<section class="section"><span class="label">Rôles spéciaux</span><div class="chips">${chips}</div></section>
    <section class="section"><span class="label">Loups-Garous</span>
      <div class="stepper"><button data-act="o-send" data-a="lg-set" data-x="wolves:-" aria-label="Un loup de moins">−</button><output>${c.wolves}</output><button data-act="o-send" data-a="lg-set" data-x="wolves:+" aria-label="Un loup de plus">+</button>
      <button class="btn-small" data-act="o-send" data-a="lg-set" data-x="wolves:auto" aria-pressed="${!st.wolves}">Auto</button></div></section>
    <section class="section"><span class="label">Débat du jour</span><div class="chips">${debates.map(([s, l]) => `<button class="chip" data-act="o-send" data-a="lg-set" data-x="debate:${s}" aria-pressed="${st.debate === s}">${l}</button>`).join("")}</div></section>
    <div class="confirm"><span class="label">Composition pour ${n} joueur${n > 1 ? "s" : ""}</span><p>${esc(lgCompText(lgCompCount(lgComposition(n, st).roles)))}</p>
      ${c.dropped.length ? `<p class="hint">Pas assez de joueurs pour : ${esc(c.dropped.map(r => LG_ROLES[r].name).join(", "))}.</p>` : ""}
      ${n < 6 ? `<p class="hint">Minimum 4 joueurs, idéal à partir de 6.</p>` : ""}</div>`;
}

/* ---------- Écrans en ligne ---------- */
function vOnline() {
  if (O.screen === "entry") return vOEntry();
  if (O.screen === "lost") return vOLost();
  const v = O.view;
  if (!v) return `<p class="lead">Connexion…</p>`;
  if (!v.game) return vOLobby(v);
  return v.game.kind === "uc" ? vOUc(v) : v.game.kind === "lg" ? vOLg(v) : vOQs(v);
}
function vOEntry() {
  return `${backHome}
  <header class="section">
    <span class="eyebrow">En ligne · un téléphone par joueur</span>
    <h1>${O.pendingGame ? esc(GAME_NAMES[O.pendingGame]) : "Lobby"}</h1>
    <p class="lead">Crée le lobby et partage le code à tes potes, ou rejoins celui d'un pote. Tu pourras changer de jeu dans le lobby.</p>
  </header>
  ${ONLINE_OK ? "" : `<div class="banner warn">Le mode en ligne ne marche pas dans cet aperçu. Pour jouer en ligne, ouvre le site : <a href="https://mirwaisxx.github.io/jeux/" target="_blank" rel="noopener" style="color:inherit">mirwaisxx.github.io/jeux</a></div>`}
  <section class="section">
    <label class="label" for="o-name">Ton pseudo</label>
    <input type="text" id="o-name" data-o="name" maxlength="16" value="${esc(ostore.name)}" placeholder="Ex. Mirwais" autocomplete="off">
  </section>
  <button class="btn" data-act="o-create" ${O.busy ? "disabled" : ""}>Créer un lobby${O.pendingGame ? " " + esc(GAME_NAMES[O.pendingGame]) : ""}</button>
  <section class="confirm">
    <label class="label" for="o-code">Rejoindre avec un code</label>
    <input type="text" id="o-code" class="code-input" data-o="code" maxlength="4" value="${esc(O.code)}" placeholder="KXPM" autocomplete="off" autocapitalize="characters">
    <button class="btn-ghost" data-act="o-join" ${O.busy ? "disabled" : ""}>Rejoindre</button>
  </section>
  <p class="msg">${esc(O.msg)}</p>
  <p class="hint">Le téléphone qui crée le lobby sert de serveur : il doit garder la page ouverte jusqu'à la fin. Si la connexion échoue, mettez-vous sur le même wifi.</p>`;
}
function vOLost() {
  return `<header class="section">
    <span class="eyebrow">Lobby ${esc(O.code)}</span>
    <h2>Connexion perdue</h2>
    <p class="lead">La connexion avec l'hôte s'est coupée. Tu reprendras ta place dans la partie dès que ça reconnecte.</p>
  </header>
  <p class="msg">${esc(O.msg)}</p>
  <button class="btn" data-act="o-rejoin" ${O.busy ? "disabled" : ""}>Réessayer maintenant</button>
  <button class="btn-ghost" data-act="o-leave">Quitter</button>`;
}
function scoreBlock(v) {
  const sc = Object.entries(v.scores || {}).sort((a, b) => b[1] - a[1]);
  if (!sc.length) return "";
  return `<section class="section"><span class="label">Points du lobby</span><div class="scores">${sc.map(([n, s]) => `<div class="score-row"><span>${esc(n)}</span><b>${s} pts</b></div>`).join("")}</div></section>`;
}
function leaveBlock(v) {
  if (O.confirmLeave) return `<div class="confirm"><p>Si tu quittes, le lobby se ferme pour tout le monde.</p><div class="row"><button class="btn btn-danger" data-act="o-leaveNow">Fermer le lobby</button><button class="btn-ghost" data-act="o-cancelLeave">Rester</button></div></div>`;
  return `<button class="btn-ghost" data-act="o-leave">${v.isHost ? "Fermer le lobby" : "Quitter le lobby"}</button>`;
}
function vOLobby(v) {
  const s = v.settings;
  const gameName = GAME_NAMES[s.game];
  const plist = v.players.map(p => `<div class="score-row"><span>${p.online ? "" : "(hors ligne) "}${esc(p.name)}${p.host ? " · hôte" : ""}${p.pid === v.me ? " · toi" : ""}</span>${v.isHost && !p.host ? `<button class="btn-small" data-act="o-send" data-a="kick" data-x="${p.pid}">Retirer</button>` : "<b></b>"}</div>`).join("");
  let settings;
  if (v.isHost) {
    const gameChips = `<div class="chips"><button class="chip" data-act="o-send" data-a="set-game" data-x="uc" aria-pressed="${s.game === "uc"}">Undercover</button><button class="chip" data-act="o-send" data-a="set-game" data-x="qs" aria-pressed="${s.game === "qs"}">Devine Tête</button><button class="chip" data-act="o-send" data-a="set-game" data-x="lg" aria-pressed="${s.game === "lg"}">Loup-Garou</button></div>`;
    const opts = s.game === "lg" ? lgLobbySettings(v) : s.game === "uc"
      ? `<div class="chips"><button class="chip" data-act="o-send" data-a="theme" data-x="all" aria-pressed="${s.themes.includes("all")}">Tous les thèmes</button>${allThemes().map(t => `<button class="chip" data-act="o-send" data-a="theme" data-x="${esc(t.id)}" aria-pressed="${s.themes.includes(t.id)}">${esc(t.name)}<small>${t.pairs.length}</small></button>`).join("")}</div>
         <div class="toggle"><div class="t-text"><div class="label">Mr. White</div><div class="t-sub">Un joueur sans mot, à partir de 4 joueurs.</div></div><button class="switch" role="switch" aria-label="Activer Mr. White" aria-checked="${s.white}" data-act="o-send" data-a="white"></button></div>`
      : `<div class="chips"><button class="chip" data-act="o-send" data-a="cat" data-x="all" aria-pressed="${s.cats.includes("all")}">Tout</button>${DT_CATS.map(c => `<button class="chip" data-act="o-send" data-a="cat" data-x="${c.id}" aria-pressed="${s.cats.includes(c.id)}">${esc(c.name)}<small>${c.words.length}</small></button>`).join("")}</div>`;
    settings = `<section class="section"><span class="label">Jeu</span>${gameChips}</section>
      ${s.game === "lg" ? opts : `<section class="section"><span class="label">${s.game === "uc" ? "Thèmes" : "Persos proposés"}</span>${opts}</section>`}
      <p class="msg">${esc(v.note)}</p>
      <button class="btn" data-act="o-send" data-a="start">Lancer ${gameName}</button>`;
  } else {
    settings = `<section class="confirm"><span class="label">${gameName}</span><p class="hint">${esc(s.summary)}</p><p>En attente que l'hôte lance la partie.</p></section>`;
  }
  return `<header class="section">
    <span class="eyebrow">Lobby · ${v.players.length} joueur${v.players.length > 1 ? "s" : ""}</span>
    <div class="code-big">${esc(v.code)}</div>
    <div class="share"><code id="o-link">${esc(shareLink(v.code))}</code><button class="btn-small" data-act="o-copy">${O.copied ? "Lien copié" : "Copier le lien"}</button></div>
  </header>
  <section class="section"><span class="label">Joueurs</span><div class="scores">${plist}</div></section>
  ${settings}
  ${scoreBlock(v)}
  ${leaveBlock(v)}`;
}
const waitHost = `<p class="hint">En attente de l'hôte.</p>`;

function vOUc(v) {
  const g = v.game;
  const myCard = !g.inGame ? `<div class="banner warn">Tu as rejoint pendant la partie : tu joueras à la prochaine.</div>` : `<div class="card">
      <span class="eyebrow">${g.alive ? "Ton mot" : "Tu es éliminé · ton mot"}</span>
      ${O.revealMine ? (g.white ? `<div class="word">Mr. White</div><p class="white-note">Tu n'as pas de mot. Écoute les autres et bluffe.</p>` : `<div class="word">${esc(g.word)}</div>`) : `<span class="redact" aria-hidden="true">██████</span>`}
      <button class="btn-small" data-act="o-reveal" style="background:var(--ink)">${O.revealMine ? "Cacher" : "Afficher mon mot"}</button>
    </div>`;
  const note = g.note ? `<div class="banner warn">${esc(g.note)}</div>` : "";
  if (g.phase === "talk") {
    return `<header class="section"><span class="eyebrow">Tour ${g.round} · thème ${esc(g.theme)}</span><h2>Chacun donne un indice</h2>
      <p class="lead">Un mot ou une phrase courte pour décrire ton mot sans le dire. Dans cet ordre :</p></header>
      ${note}${myCard}
      <ol class="order">${g.order.map(n => `<li><span>${esc(n)}</span></li>`).join("")}</ol>
      ${v.isHost ? `<button class="btn" data-act="o-send" data-a="uc-tovote">Passer au vote</button>` : `<p class="hint">L'hôte lance le vote quand tout le monde a parlé.</p>`}
      ${leaveBlock(v)}`;
  }
  if (g.phase === "vote") {
    const done = g.list.filter(p => p.alive && p.voted).length, total = g.list.filter(p => p.alive).length;
    let mine;
    if (!g.alive) mine = `<p class="hint">Tu es éliminé : tu ne votes pas.</p>`;
    else if (g.myVote) mine = `<div class="banner">Tu as voté contre ${esc(g.myVote)}.</div>`;
    else {
      const choices = g.list.filter(p => p.alive && p.pid !== v.me);
      const sel = choices.find(p => p.pid === O.sel);
      mine = `<div class="vote">${choices.map(p => `<button data-act="o-sel" data-x="${p.pid}" aria-pressed="${O.sel === p.pid}"><span>${esc(p.name)}</span></button>`).join("")}</div>
        ${sel ? `<button class="btn btn-danger" data-act="o-send" data-a="uc-vote" data-x="${sel.pid}">Voter contre ${esc(sel.name)}</button>` : ""}`;
    }
    return `<header class="section"><span class="eyebrow">Tour ${g.round} · vote</span><h2>Qui est l'intrus ?</h2>
      <p class="lead">Chacun vote sur son téléphone. Votes reçus : ${done}/${total}.</p></header>
      ${mine}
      <section class="section"><span class="label">Ont voté</span><div class="scores">${g.list.filter(p => p.alive).map(p => `<div class="score-row"><span>${esc(p.name)}</span><b class="${p.voted ? "voted" : ""}">${p.voted ? "a voté" : "…"}</b></div>`).join("")}</div></section>
      ${v.isHost && done < total ? `<button class="btn-ghost" data-act="o-send" data-a="uc-force">Dépouiller sans attendre</button>` : ""}
      ${myCard}`;
  }
  const votes = g.lastVotes && g.lastVotes.length ? `<section class="section"><span class="label">Les votes</span><div class="scores">${g.lastVotes.map(([a, b]) => `<div class="score-row"><span>${esc(a)}</span><b>→ ${esc(b)}</b></div>`).join("")}</div></section>` : "";
  if (g.phase === "out") {
    const civ = g.out.role === "civil";
    return `<header class="section"><span class="eyebrow">Tour ${g.round} · résultat du vote</span><h2>${esc(g.out.name)} est éliminé</h2></header>
      <div class="card"><div class="stamp ${civ ? "civil" : ""}">${ROLE_LABEL[g.out.role]}</div><p>${civ ? "Raté, c'était un civil." : "Bien joué, l'Undercover est démasqué."}</p></div>
      ${votes}
      ${v.isHost ? `<button class="btn" data-act="o-send" data-a="uc-continue">Continuer</button>` : waitHost}`;
  }
  if (g.phase === "white") {
    const meWhite = g.out.pid === v.me;
    let body;
    if (!g.whiteGuess) {
      body = meWhite
        ? `<p class="lead">Dernière chance : devine le mot des civils pour gagner seul.</p>
           <input type="text" id="o-guess" data-o="guess" value="${esc(O.guess)}" placeholder="Le mot des civils…" autocomplete="off">
           <button class="btn" data-act="o-send" data-a="uc-guess" data-from="guess">Valider ma réponse</button>`
        : `<p class="lead">${esc(g.out.name)} tente de deviner le mot des civils sur son téléphone…</p>`;
    } else {
      body = `<div class="card"><div class="stamp civil">Raté</div><p>${esc(g.out.name)} a proposé « ${esc(g.whiteGuess.text)} ».</p></div>
        ${v.isHost ? `<button class="btn" data-act="o-send" data-a="uc-continue">Continuer</button>` : waitHost}`;
    }
    return `<header class="section"><span class="eyebrow">Tour ${g.round} · résultat du vote</span><h2>${esc(g.out.name)} était Mr. White</h2></header>
      ${body}${votes}`;
  }
  const e = g.end;
  const title = { civils: "Les civils gagnent", impostors: "L'Undercover gagne", white: "Mr. White gagne" }[e.winner];
  return `<header class="section"><span class="eyebrow">Fin de partie · thème ${esc(g.theme)}</span><h1 style="font-size:3rem">${title}</h1></header>
    ${g.whiteGuess && g.whiteGuess.ok ? `<div class="banner">${esc(g.out.name)} a trouvé le mot des civils : « ${esc(g.whiteGuess.text)} ».</div>` : ""}
    <div class="card">
      <div class="row" style="width:100%">
        <div><span class="eyebrow">Mot civil</span><div class="word" style="font-size:2rem">${esc(e.civil)}</div></div>
        <div><span class="eyebrow">Mot undercover</span><div class="word" style="font-size:2rem;color:var(--stamp)">${esc(e.ucw)}</div></div>
      </div>
      <div class="recap">${e.roles.map(p => `<div class="recap-row"><span class="${p.alive ? "" : "out"}">${esc(p.name)}</span><span class="role-tag ${p.role === "uc" ? "uc" : p.role === "white" ? "mw" : ""}">${ROLE_LABEL[p.role]}</span></div>`).join("")}</div>
    </div>
    ${scoreBlock(v)}
    ${v.isHost ? `<button class="btn" data-act="o-send" data-a="again">Rejouer</button><button class="btn-ghost" data-act="o-send" data-a="lobby">Retour au lobby</button>` : waitHost}`;
}

function vOQs(v) {
  const g = v.game;
  if (g.phase === "pick") {
    let body;
    if (g.target && !g.target.validated) {
      const t = g.target;
      body = `<header class="section"><span class="eyebrow">Choix des persos · ${g.done}/${g.total} validés</span>
          <h2>Tu choisis le perso de ${esc(t.name)}</h2>
          <p class="lead">Garde-le, reroll-le ou écris le tien. ${esc(t.name)} ne le verra pas.</p></header>
        <div class="card">${charImg(t.pick)}<span class="eyebrow">${esc(t.pick.c)}</span><div class="word">${esc(t.pick.w)}</div>
          ${t.rerolls ? `<span class="eyebrow">${t.rerolls} reroll${t.rerolls > 1 ? "s" : ""}</span>` : ""}</div>
        <div class="row">
          <button class="btn-ghost" data-act="o-send" data-a="qs-reroll">Reroll</button>
          <button class="btn" data-act="o-send" data-a="qs-validate">Valider</button>
        </div>
        <section class="confirm">
          <label class="label" for="o-draft">Ou écris ton perso</label>
          <input type="text" id="o-draft" data-o="draft" maxlength="40" value="${esc(O.draft)}" placeholder="Ex. Zidane, Shrek, un pote…" autocomplete="off">
          ${photoRow("o-photo", O.draftImg)}
          <button class="btn-ghost" data-act="o-send" data-a="qs-custom" data-from="draft">Utiliser ce nom</button>
        </section>`;
    } else {
      body = `<header class="section"><span class="eyebrow">Choix des persos</span><h2>Perso validé</h2>
        <p class="lead">En attente des autres : ${g.done}/${g.total} validés.</p></header>
        ${g.waiting.length ? `<p class="hint">Encore en train de choisir : ${esc(listNames(g.waiting))}.</p>` : ""}
        ${v.isHost && g.done < g.total ? `<button class="btn-ghost" data-act="o-send" data-a="qs-forcepick">Commencer sans attendre</button>` : ""}`;
    }
    return body + leaveBlock(v);
  }
  const rows = g.list.map(p => `<div class="qs-row ${p.cur ? "cur" : ""} ${p.found ? "found" : ""}">
      <span class="who-n">${p.rank ? p.rank + ". " : ""}${esc(p.name)}${p.me ? " · toi" : ""}</span>
      <span class="meta">${p.found ? "trouvé · " : ""}${p.q} question${p.q > 1 ? "s" : ""}</span>
      <span class="pick ${p.pick ? "" : "hidden"}">${p.pick ? charImg(p.pick, "char-thumb") + esc(p.pick.w) : "???"}</span>
    </div>`).join("");
  if (g.phase === "end") {
    return `<header class="section"><span class="eyebrow">Fin de partie</span><h1 style="font-size:3rem">${g.list.find(p => p.rank === 1) ? esc(g.list.slice().sort((a, b) => (a.rank || 99) - (b.rank || 99))[0].name) + " gagne" : "Partie terminée"}</h1></header>
      <div class="qs-list">${g.list.slice().sort((a, b) => (a.rank || 99) - (b.rank || 99)).map(p => `<div class="qs-row ${p.found ? "" : "found"}"><span class="who-n">${p.rank ? p.rank + ". " : ""}${esc(p.name)}</span><span class="meta">${p.found ? p.q + " question" + (p.q > 1 ? "s" : "") : "pas trouvé"}</span><span class="pick">${charImg(p.pick, "char-thumb")}${esc(p.pick.w)}</span></div>`).join("")}</div>
      <p class="hint">1er : +3 pts · 2e : +2 pts · 3e : +1 pt</p>
      ${scoreBlock(v)}
      ${v.isHost ? `<button class="btn" data-act="o-send" data-a="again">Rejouer</button><button class="btn-ghost" data-act="o-send" data-a="lobby">Retour au lobby</button>` : waitHost}`;
  }
  const ev = g.event ? `<div class="banner">${esc(g.event.name)} a trouvé : ${esc(g.event.w)} (${g.event.q} question${g.event.q > 1 ? "s" : ""})</div>` : "";
  const head = g.meCur
    ? `<h2>À toi de poser ta question</h2><p class="lead">Pose une seule question fermée à voix haute. Les autres répondent par oui ou non.</p>`
    : `<h2>À ${esc(g.curName)} de poser sa question</h2><p class="lead">Réponds par oui ou non, puis appuyez sur un des deux boutons.</p>`;
  const actions = g.meCur || !g.inGame ? "" : `<div class="row">
      <button class="btn-ghost" data-act="o-send" data-a="qs-next" data-x="${g.step}">Question posée, joueur suivant</button>
      <button class="btn" data-act="o-send" data-a="qs-found" data-x="${g.step}">${esc(g.curName)} a trouvé</button>
    </div>`;
  const stop = !v.isHost ? "" : O.confirmStop
    ? `<div class="confirm"><p>Arrêter la partie et révéler tous les persos ?</p><div class="row"><button class="btn btn-danger" data-act="o-send" data-a="qs-stop">Révéler</button><button class="btn-ghost" data-act="o-stopToggle">Continuer</button></div></div>`
    : `<button class="btn-ghost" data-act="o-stopToggle">Arrêter la partie</button>`;
  return `<header class="section"><span class="eyebrow">Tour ${g.turn}</span>${head}</header>
    ${ev}${actions}
    <div class="qs-list">${rows}</div>
    ${stop}`;
}

/* =========================================================
   ACCUEIL + RENDU
   ========================================================= */
const GAME_NAMES = { uc: "Undercover", qs: "Devine Tête", lg: "Loup-Garou" };
const HOME_ART = {
  uc: `<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M14 50 C14 36 34 32 60 40 C86 32 106 36 106 50 C106 70 92 82 78 78 C70 76 66 66 60 66 C54 66 50 76 42 78 C28 82 14 70 14 50 Z" fill="#e8434a"/><path d="M60 40 C86 32 106 36 106 50 C106 70 92 82 78 78 C70 76 66 66 60 66 Z" fill="#c8323a"/><ellipse cx="40" cy="56" rx="11" ry="8" fill="#141a4d"/><ellipse cx="80" cy="56" rx="11" ry="8" fill="#141a4d"/><circle cx="36" cy="53" r="2.5" fill="#fff"/><circle cx="76" cy="53" r="2.5" fill="#fff"/><path d="M14 50 C6 46 2 54 6 60 M106 50 C114 46 118 54 114 60" stroke="#e8434a" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`,
  dt: `<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M20 22 H100 A10 10 0 0 1 110 32 V76 A10 10 0 0 1 100 86 H58 L34 106 V86 H20 A10 10 0 0 1 10 76 V32 A10 10 0 0 1 20 22 Z" fill="#3fd48c"/><path d="M60 22 H100 A10 10 0 0 1 110 32 V76 A10 10 0 0 1 100 86 H60 Z" fill="#2fbf79"/><path d="M48 44 C48 34 72 32 72 46 C72 56 60 56 60 64" stroke="#141a4d" stroke-width="9" stroke-linecap="round" fill="none"/><circle cx="60" cy="76" r="5.5" fill="#141a4d"/></svg>`
};
const ICON_LOCAL = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const ICON_ONLINE = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="19.5" r="1.6" fill="currentColor"/></svg>`;
function vHome() {
  const local = act => `<button class="mode-btn" data-act="${act}">${ICON_LOCAL}Local</button>`;
  const online = g => `<button class="mode-btn on" data-act="go-online" data-g="${g}">${ICON_ONLINE}En ligne</button>`;
  const card = (cls, art, players, name, desc, modes) => `<article class="game-card">
      <div class="gart">${art}</div>
      <span class="gmeta ${cls}">${players}</span>
      <span class="gname">${name}</span>
      <span class="gdesc">${desc}</span>
      <div class="modes ${modes.length === 1 ? "single" : ""}">${modes.join("")}</div>
    </article>`;
  return `<header class="home-head">
    <h1>Simwar</h1>
    <p class="lead">Undercover · Devine Tête · Loup-Garou</p>
  </header>
  <section class="quickjoin">
    <label class="label" for="home-code">Rejoindre une partie avec un code</label>
    <div class="qj-row">
      <input type="text" id="home-code" class="code-input" data-o="code" maxlength="4" value="${esc(O.code)}" placeholder="KXPM" autocomplete="off" autocapitalize="characters">
      <button class="btn" data-act="o-quickjoin">Rejoindre</button>
    </div>
  </section>
  <div class="games">
    ${card("gm-uc", HOME_ART.uc, "3 à 10 joueurs", "Undercover", "Tout le monde a le même mot, sauf l'intrus. Indices, vote, démasquez-le.", [local("go-uc"), online("uc")])}
    ${card("gm-dt", HOME_ART.dt, "2 à 10 joueurs", "Devine Tête", "Trouve ton perso en posant des questions oui ou non.", [local("go-dt"), online("qs")])}
    ${card("gm-lg", LG_ART.wolf, "4 à 12 joueurs", "Loup-Garou", "12 rôles, l'appli fait le narrateur.", [online("lg")])}
  </div>`;
}

let lastKey = "";
function render() {
  const app = document.getElementById("app");
  let html, key;
  if (S.view === "home") { html = vHome(); key = "home"; }
  else if (S.view === "uc") {
    const views = { setup: vSetup, reveal: vReveal, talk: vTalk, vote: vVote, outcome: vOutcome, whiteGuess: vWhiteGuess, end: vEnd };
    html = views[ui.screen](); key = "uc-" + ui.screen + (G ? "-" + G.revealIdx + "-" + G.round : "");
  } else if (S.view === "online") {
    html = vOnline();
    const gv = O.view && O.view.game;
    key = "on-" + O.screen + (gv ? "-" + gv.kind + "-" + gv.phase + "-" + (gv.stage || "") + "-" + (gv.round || gv.turn || "") + "-" + (gv.nightNo || "") + "-" + (gv.dayNo || "") : O.view ? "-lobby" : "");
  } else {
    const views = { setup: vDSetup, assignReady: vDAssignReady, assignPick: vDAssignPick, turn: vDTurn, found: vDFound, end: vDEnd };
    html = views[D.screen](); key = "dt-" + D.screen + (D.game ? "-" + D.game.assign + "-" + D.game.cur : "");
  }
  const lgv = S.view === "online" && O.screen === "room" && O.view && O.view.game && O.view.game.kind === "lg" ? O.view.game : null;
  const scene = lgv ? lgSceneKind(lgv) : "";
  if ((document.body.dataset.scene || "") !== scene) { if (scene) document.body.dataset.scene = scene; else delete document.body.dataset.scene; }
  const ae = document.activeElement, fid = ae && ae.id && /INPUT|TEXTAREA/.test(ae.tagName) ? ae.id : null;
  let ss = null; try { ss = fid ? ae.selectionStart : null; } catch (e) {}
  app.innerHTML = html;
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (ss !== null) el.setSelectionRange(ss, ss); } catch (e) {} } }
  if (lgv) lgSpeak(lgv.say);
  if (key !== lastKey) {
    if (S.view === "online") { O.revealMine = false; O.sel = null; O.confirmStop = false; O.sel2 = []; O.wSave = false; O.wKill = null; O.lgFlip = false; O.lgPeek = false; }
    window.scrollTo(0, 0); lastKey = key;
  }
}

/* =========================================================
   Événements
   ========================================================= */
document.addEventListener("input", e => {
  const i = e.target.dataset.name, j = e.target.dataset.dname;
  if (i !== undefined) { cfg.names[+i] = e.target.value; saveCfg(); }
  if (j !== undefined) { dcfg.names[+j] = e.target.value; dSave(); }
  if (e.target.dataset.ddraft) D.draft = e.target.value;
  const o = e.target.dataset.o;
  if (o === "name") ostore.name = e.target.value;
  if (o === "code") { const c = e.target.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4); if (c !== e.target.value) e.target.value = c; O.code = c; }
  if (o === "draft") O.draft = e.target.value;
  if (o === "guess") O.guess = e.target.value;
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id !== "dt-photo" && id !== "o-photo") return;
  const f = e.target.files && e.target.files[0];
  readPhoto(f, data => {
    if (!data) { if (id === "dt-photo") D.msg = "Impossible de lire cette image."; else O.msg = "Impossible de lire cette image."; return render(); }
    if (id === "dt-photo") D.draftImg = data; else O.draftImg = data;
    render();
  });
});
document.addEventListener("toggle", e => { if (e.target.dataset && e.target.dataset.det === "themes") ui.openThemes = e.target.open; }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "guess") { const b = document.querySelector('[data-act="guess"]'); if (b) b.click(); return; }
  if (e.key === "Enter" && e.target.id === "home-code") { const b = document.querySelector('[data-act="o-quickjoin"]'); if (b) b.click(); return; }
  if (e.key === "Enter" && e.target.id === "o-code") { const b = document.querySelector('[data-act="o-join"]'); if (b) b.click(); return; }
  if (e.key === "Enter" && e.target.id === "o-guess") { const b = document.querySelector('[data-a="uc-guess"]'); if (b) b.click(); return; }
  if (e.key === "Enter" && e.target.id === "o-draft") { const b = document.querySelector('[data-a="qs-custom"]'); if (b) b.click(); return; }
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  ui.msg = ""; D.msg = "";
  switch (a) {
    /* navigation */
    case "home": stopTimers(); releaseAwake(); exitFullscreen(); S.view = "home"; break;
    case "go-uc": S.view = "uc"; if (!G) ui.screen = "setup"; break;
    case "go-dt": S.view = "dt"; D.reveal = false; break;
    case "go-online": S.view = "online"; if (O.screen !== "room") { O.pendingGame = b.dataset.g || null; O.msg = ""; } break;
    case "o-quickjoin":
      S.view = "online"; O.pendingGame = null;
      if (cleanName(ostore.name) && /^[A-Z]{4}$/.test(O.code)) { initAudio(); return oJoin(); }
      O.msg = /^[A-Z]{4}$/.test(O.code) ? "Choisis ton pseudo, puis appuie sur Rejoindre." : "Entre le code à 4 lettres.";
      break;

    /* en ligne */
    case "o-create": initAudio(); return oCreate();
    case "o-join": initAudio(); return oJoin();
    case "o-leave":
      if (O.isHost && L && L.players.length > 1) { O.confirmLeave = true; break; }
      oLeave(); break;
    case "o-leaveNow": oLeave(); break;
    case "o-rejoin": O.retries = 0; clearTimeout(O.retryT); return oJoin(true);
    case "o-cancelLeave": O.confirmLeave = false; break;
    case "o-copy": return oCopy();
    case "o-reveal": O.revealMine = !O.revealMine; break;
    case "o-sel": O.sel = b.dataset.x; break;
    case "o-stopToggle": O.confirmStop = !O.confirmStop; break;
    case "o-lgflip": O.lgFlip = !O.lgFlip; break;
    case "photo-clear": if (b.dataset.x === "dt-photo") D.draftImg = null; else O.draftImg = null; break;
    case "o-lgpeek": O.lgPeek = !O.lgPeek; break;
    case "o-lgsel": O.sel = b.dataset.x; break;
    case "o-lgpair": { const x = b.dataset.x; O.sel2 = O.sel2.includes(x) ? O.sel2.filter(y => y !== x) : O.sel2.concat(x).slice(-2); break; }
    case "o-lgwsave": O.wSave = !O.wSave; break;
    case "o-lgwkill": O.wKill = b.dataset.x === "none" ? null : b.dataset.x; break;
    case "o-voice": O.voice = !O.voice; if (!O.voice) { try { speechSynthesis.cancel(); } catch (e) {} } break;
    case "o-sfx": O.sfx = !O.sfx; break;
    case "o-lgsend": {
      const k = b.dataset.k;
      const x = k === "sel" ? O.sel : k === "pair" ? O.sel2.join(",") : k === "witch" ? (O.wSave ? "1" : "0") + "|" + (O.wKill || "none") : b.dataset.x;
      if (!x) return;
      O.sel = null; O.sel2 = []; O.wSave = false; O.wKill = null;
      oSend({ a: b.dataset.a, x });
      if (!O.isHost) render();
      return;
    }
    case "o-send": {
      const from = b.dataset.from;
      const x = from ? O[from] : b.dataset.x;
      if (from && !String(x || "").trim()) return;
      oSend(b.dataset.a === "qs-custom" && O.draftImg ? { a: b.dataset.a, x, img: O.draftImg } : { a: b.dataset.a, x });
      if (b.dataset.a === "qs-custom") O.draftImg = null;
      if (b.dataset.a === "uc-vote") O.sel = null;
      if (from) { O[from] = ""; render(); }
      if (b.dataset.a === "qs-stop") O.confirmStop = false;
      return;
    }

    /* undercover */
    case "count": {
      cfg.count = Math.min(10, Math.max(3, cfg.count + +b.dataset.d));
      while (cfg.names.length < cfg.count) cfg.names.push("");
      saveCfg(); break;
    }
    case "theme": {
      const id = b.dataset.id;
      if (id === "all") cfg.themes = ["all"];
      else {
        let t = cfg.themes.filter(x => x !== "all");
        t = t.includes(id) ? t.filter(x => x !== id) : t.concat(id);
        cfg.themes = t.length ? t : ["all"];
      }
      saveCfg(); break;
    }
    case "white": cfg.white = !cfg.white; saveCfg(); break;
    case "addTheme": {
      const name = document.getElementById("th-name").value.trim();
      const lines = document.getElementById("th-pairs").value.split("\n");
      const pairs = lines.map(l => l.split("/").map(s => s.trim())).filter(p => p.length === 2 && p[0] && p[1]);
      ui.openThemes = true;
      if (!name) { ui.msg = "Donne un nom au thème."; break; }
      if (!pairs.length) { ui.msg = "Ajoute au moins une paire au format « mot / mot »."; break; }
      customThemes.push({ id: "c" + Date.now(), name, pairs });
      store.set("themes", customThemes);
      ui.msg = `Thème « ${name} » ajouté avec ${pairs.length} paire${pairs.length > 1 ? "s" : ""}.`;
      break;
    }
    case "delTheme": {
      customThemes = customThemes.filter(t => t.id !== b.dataset.id);
      cfg.themes = cfg.themes.filter(x => x !== b.dataset.id);
      if (!cfg.themes.length) cfg.themes = ["all"];
      store.set("themes", customThemes); saveCfg(); ui.openThemes = true; break;
    }
    case "askReset": ui.confirmReset = true; break;
    case "cancelReset": ui.confirmReset = false; break;
    case "resetScores": scores = {}; store.set("scores", scores); ui.confirmReset = false; break;
    case "start": return startGame();
    case "open": G.revealOpen = true; break;
    case "next":
      G.revealOpen = false;
      if (G.revealIdx < G.players.length - 1) G.revealIdx++;
      else ui.screen = "talk";
      break;
    case "peek": ui.peek = +b.dataset.i; ui.peekOpen = true; break;
    case "peekClose": ui.peek = null; ui.peekOpen = false; break;
    case "toVote": ui.screen = "vote"; ui.peek = null; ui.peekOpen = false; break;
    case "backTalk": ui.screen = "talk"; ui.voteSel = null; G.round++; G.order = speakOrder(); break;
    case "sel": ui.voteSel = +b.dataset.i; break;
    case "unsel": ui.voteSel = null; break;
    case "kill": return eliminate(ui.voteSel);
    case "continue": return afterOutcome();
    case "guess": {
      const v = document.getElementById("guess").value.trim();
      if (!v) return;
      G.whiteGuess = { text: v, ok: norm(v) === norm(G.civilWord) };
      break;
    }
    case "whiteWin": return endGame("white");
    case "again": return startGame();
    case "menu": case "quit": G = null; ui.screen = "setup"; break;

    /* devine tête */
    case "d-count": {
      dcfg.count = Math.min(10, Math.max(2, dcfg.count + +b.dataset.d));
      while (dcfg.names.length < dcfg.count) dcfg.names.push("");
      dSave(); break;
    }
    case "d-cat": {
      const id = b.dataset.id;
      if (id === "all") dcfg.cats = ["all"];
      else {
        let t = dcfg.cats.filter(x => x !== "all");
        t = t.includes(id) ? t.filter(x => x !== id) : t.concat(id);
        dcfg.cats = t.length ? t : ["all"];
      }
      dSave(); break;
    }
    case "d-sound": dcfg.sound = !dcfg.sound; dSave(); break;
    case "d-new": initAudio(); dNewGame(); break;
    case "d-setup": D.screen = "setup"; break;
    case "d-assign": dStartAssign(); break;
    case "d-reroll": dReroll(); break;
    case "d-custom": dCustom(); break;
    case "d-validate": dValidate(); break;
    case "d-reveal": D.reveal = !D.reveal; break;
    case "d-asked": dAsked(); break;
    case "d-found": dFound(); break;
    case "d-afterFound": dAfterFound(); break;
    case "d-askEnd": D.confirmEnd = true; break;
    case "d-cancelEnd": D.confirmEnd = false; break;
    case "d-finish": dFinish(); break;
  }
  render();
});

/* Garde la partie si la page est mise à jour pendant qu'on joue */
if (window.claude?.hot?.snapshot) window.claude.hot.snapshot(() => ({ S, cfg, G, ui, used: [...used], dcfg, D, dUsed: [...dUsed] }));
const views_ok = sc => ["setup", "assignReady", "assignPick", "turn", "found", "end"].includes(sc);
function boot(d) {
  if (d && d.cfg && d.S) {
    S = d.S; cfg = d.cfg; G = d.G; ui = d.ui; used = new Set(d.used || []);
    if (d.dcfg) dcfg = d.dcfg;
    if (d.D) D = d.D;
    dUsed = new Set(d.dUsed || []);
  }
  if (!G && ui.screen !== "setup") ui.screen = "setup";
  if (!D.wins) D.wins = {};
  if (O.code && QS.get("lobby") && ONLINE_OK) S.view = "online";
  if (S.view === "online" && !NET.peer) { O.screen = "entry"; O.view = null; }
  if (!views_ok(D.screen) || (!D.game && D.screen !== "setup")) { D.screen = "setup"; }
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
